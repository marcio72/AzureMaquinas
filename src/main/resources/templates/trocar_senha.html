<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trocar Senha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(to right, #0d1117, #161b22);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: #21262d;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 0 25px rgba(0, 123, 255, 0.15);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .card-title {
      text-align: center;
      font-weight: bold;
      color: #58a6ff;
    }
    .icon-key {
      font-size: 3.2rem;
      color: #58a6ff;
      text-align: center;
      margin-bottom: 1rem;
    }
    .form-label { color: #ccc; }
    .form-control {
      background-color: #2d333b;
      color: #fff;
      border: 1px solid #444c56;
    }
    .form-control:focus {
      background-color: #2d333b;
      border-color: #58a6ff;
      box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.25);
    }
    .btn-primary {
      background-color: #238636;
      border-color: #238636;
    }
    .btn-primary:hover {
      background-color: #2ea043;
      border-color: #2ea043;
    }
    .back-link {
      display: block;
      text-align: center;
      font-size: 0.9rem;
      color: #999;
      margin-top: 1rem;
    }
    .back-link:hover {
      color: #58a6ff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="icon-key">
        <i class="bi bi-key-fill"></i>
      </div>
      <h3 class="card-title mb-4">Trocar Senha</h3>

      <form id="form-trocar-senha" autocomplete="off">
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input type="text" class="form-control" id="username" required autocomplete="off" autofocus>
        </div>
        <div class="mb-3">
          <label for="senhaAtual" class="form-label">Senha atual</label>
          <input type="password" class="form-control" id="senhaAtual" required autocomplete="off">
        </div>
        <div class="mb-3">
          <label for="senhaNova" class="form-label">Nova senha</label>
          <input type="password" class="form-control" id="senhaNova" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label for="senhaConfirma" class="form-label">Confirmar nova senha</label>
          <input type="password" class="form-control" id="senhaConfirma" required autocomplete="new-password">
        </div>

        <div id="alerta" class="alert p-2 mt-2 d-none" role="alert"></div>

        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-check-circle"></i> Trocar Senha
        </button>

        <a href="/login" class="back-link">
          <i class="bi bi-arrow-left"></i> Voltar ao login
        </a>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('form-trocar-senha').addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const senhaAtual = document.getElementById('senhaAtual').value;
      const senhaNova = document.getElementById('senhaNova').value;
      const senhaConfirma = document.getElementById('senhaConfirma').value;
      const alerta = document.getElementById('alerta');

      function mostrarAlerta(msg, tipo) {
        alerta.textContent = msg;
        alerta.className = 'alert p-2 mt-2 alert-' + tipo;
      }

      if (senhaNova !== senhaConfirma) {
        mostrarAlerta('A nova senha e a confirmação não coincidem.', 'danger');
        return;
      }

      fetch('/api/usuarios/trocar-senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, senhaAtual, senhaNova })
      })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(resp => {
          if (resp.ok) {
            mostrarAlerta(resp.data.message || 'Senha alterada com sucesso.', 'success');
            setTimeout(() => { window.location.href = '/login'; }, 1500);
          } else {
            mostrarAlerta(resp.data.message || 'Não foi possível trocar a senha.', 'danger');
          }
        })
        .catch(() => {
          mostrarAlerta('Erro inesperado ao trocar a senha.', 'danger');
        });
    });
  </script>
</body>
</html>
