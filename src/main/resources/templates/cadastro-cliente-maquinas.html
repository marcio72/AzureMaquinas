<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente e Máquinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #081418;
            --bg-card: #10242a;
            --bg-card-header: #0a1a20;
            --primary-green: #1ee4ac;
            --accent-blue: #3d8bff;
            --text-white: #ffffff;
            --text-gray: #8ea1a7;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg-body) !important;
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-white);
        }

        .card-header {
            background: var(--bg-card-header) !important;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-white) !important;
        }
        .card-header i { color: var(--primary-green); }

        .form-label { color: var(--text-gray); font-size: 13px; font-weight: 600; }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-white);
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(30, 228, 172, 0.15);
            color: var(--text-white);
        }
        .form-control::placeholder { color: var(--text-gray); }
        .form-select option { background: var(--bg-card); color: var(--text-white); }

        .bg-light { background: rgba(255, 255, 255, 0.03) !important; }
        fieldset.border { border-color: var(--border-color) !important; }
        .text-muted { color: var(--text-gray) !important; }
        legend.scheduler-border { color: var(--text-gray) !important; }
        hr { border-color: var(--border-color); opacity: 1; }

        .btn-outline-secondary { color: var(--text-gray); border-color: var(--border-color); }
        .btn-outline-secondary:hover { background: rgba(255,255,255,0.08); color: var(--text-white); border-color: var(--border-color); }
        .btn-secondary { background: rgba(255,255,255,0.08); border-color: var(--border-color); color: var(--text-white); }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); border-color: var(--border-color); color: var(--text-white); }
        .btn-success { background: var(--primary-green); border-color: var(--primary-green); color: #081418 !important; font-weight: 700; }
        .btn-success:hover { background: #17c99a; border-color: #17c99a; }
        .btn-outline-danger { color: #ff6b6b; border-color: rgba(255,107,107,0.4); }
        .btn-outline-danger:hover { background: rgba(255,107,107,0.15); color: #ff6b6b; border-color: rgba(255,107,107,0.4); }

        .machine-card {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: .5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            color: var(--text-white);
        }
        .machine-card small { color: var(--text-gray); }

        .summary-link {
            cursor: pointer;
            color: var(--accent-blue) !important;
            text-decoration: none;
            font-weight: 500;
        }
        .summary-link:hover { text-decoration: underline; }

        /* Estilo para a legenda do fieldset */
        legend.scheduler-border {
            font-size: 1rem !important;
            font-weight: 500 !important;
            text-align: left !important;
            width: auto;
            padding: 0 10px;
            border-bottom: none;
            color: var(--text-gray) !important;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0"><i class="bi bi-person-plus-fill"></i> Novo Cliente e Máquinas</h4>
        </div>
        <div class="card-body">

            <!-- DADOS DO CLIENTE -->
            <h5 class="mb-3">1. Dados do Cliente</h5>
            <div id="form-cliente" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome do Ponto</label>
                    <input type="text" id="nomCliente" class="form-control" th:value="${nomePonto}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Logradouro</label>
                    <input type="text" id="logradouro" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Bairro</label>
                    <input type="text" id="bairro" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" id="telefone" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Contato</label>
                    <input type="text" id="contato" class="form-control">
                </div>

                <!-- CAMPO PRAÇA: vai pra coluna `praca` de Tbl_Cliente -->
                <div class="col-md-4">
                    <label class="form-label">Praça</label>
                    <select id="praca" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option th:each="i : ${#numbers.sequence(1, 10)}" th:value="'V' + ${i}" th:text="'V' + ${i}"></option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Região</label>
                    <select id="regiao" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option value="1">Norte</option>
                        <option value="2">Sul</option>
                        <option value="3">Leste</option>
                        <option value="4">Oeste</option>
                        <option value="5">Centro</option>
                        <option value="6">ABC</option>
                    </select>
                </div>
            </div>

            <hr class="my-4">

            <h5 class="mb-3">2. Adicionar Máquinas</h5>
            <div class="card p-3 mb-3">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nº da Máquina</label>
                        <input type="text" id="maq_nome" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nome do Jogo</label>
                        <input type="text" id="maq_jogo" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nº da Placa</label>
                        <input type="text" id="maq_placa" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observação</label>
                        <input type="text" id="maq_obs" class="form-control">
                    </div>

                    <!-- Seção Leitura Inicial -->
                    <div class="col-12 mt-3">
                        <fieldset class="border p-3 rounded bg-light">
                            <legend class="float-none w-auto px-2 h6 scheduler-border text-muted">Leitura Inicial</legend>
                            <div class="row">
                                <div class="col-md-6">
                                    <label for="Entrada" class="form-label">Entrada</label>
                                    <input type="text" id="Entrada" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label for="Saida" class="form-label">Saída</label>
                                    <input type="text" id="Saida" class="form-control">
                                </div>
                            </div>
                        </fieldset>
                    </div>

                    <!-- Botão de adicionar alinhado à direita -->
                    <div class="col-12 text-end">
                        <button type="button" class="btn btn-secondary mt-3" onclick="adicionarMaquina()">
                            <i class="bi bi-plus-circle"></i> Adicionar à Lista
                        </button>
                    </div>
                </div>
            </div>

            <h5 class="mb-3">Máquinas a serem Cadastradas</h5>
            <div id="maquinas_container">
                <p class="text-muted">Nenhuma máquina adicionada.</p>
            </div>

            <div class="mt-4 d-flex justify-content-between">
                <a href="/menu" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar ao Menu</a>
                <button type="button" class="btn btn-success btn-lg" onclick="salvarTudo()">
                    <i class="bi bi-check-circle-fill"></i> Salvar Cliente e Máquinas
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    /* ========= CONFIG ========= */
    // URL do Form_execucao (com técnico fixo Admin)
    const FORM_EXECUCAO_URL = 'http://localhost:8080/form_execucao?tecnico=Admin';

    /* ========= ESTADO ========= */
    let maquinasAdicionadas = [];

    /* =======================================================
       PRÉ-PREENCHER COM OS DADOS DO PEDIDO (vindo do form_execucao)
       Formato esperado (3 linhas):
         Nome do Ponto
         Logradouro - Bairro
         Telefone / Contato
    ========================================================= */
    function parseTextoPedido(texto) {
        const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const dados = { nomeCliente: '', logradouro: '', bairro: '', telefone: '', contato: '' };

        if (linhas[0]) dados.nomeCliente = linhas[0];

        if (linhas[1]) {
            const partes = linhas[1].split(' - ');
            dados.logradouro = (partes[0] || '').trim();
            dados.bairro = partes.length > 1 ? partes.slice(1).join(' - ').trim() : '';
        }

        if (linhas[2]) {
            const partes = linhas[2].split(' - ');
            dados.telefone = (partes[0] || '').trim();
            dados.contato = partes.length > 1 ? partes.slice(1).join(' - ').trim() : '';
        }

        return dados;
    }

    function preencherComDadosDoPedido() {
        const params = new URLSearchParams(window.location.search);
        const pedidoTexto = params.get('pedidoTexto');
        if (!pedidoTexto) return;

        const dados = parseTextoPedido(pedidoTexto);

        const campoNome = document.getElementById('nomCliente');
        if (campoNome && !campoNome.value) campoNome.value = dados.nomeCliente;

        const campoLog = document.getElementById('logradouro');
        if (campoLog && !campoLog.value) campoLog.value = dados.logradouro;

        const campoBairro = document.getElementById('bairro');
        if (campoBairro && !campoBairro.value) campoBairro.value = dados.bairro;

        const campoTelefone = document.getElementById('telefone');
        if (campoTelefone && !campoTelefone.value) campoTelefone.value = dados.telefone;

        const campoContato = document.getElementById('contato');
        if (campoContato && !campoContato.value) campoContato.value = dados.contato;
    }

    document.addEventListener('DOMContentLoaded', preencherComDadosDoPedido);

    /* ========= UI ========= */
    function toggleListaMaquinas() {
        const lista = document.getElementById('lista-maquinas-detalhes');
        if (lista) {
            lista.style.display = (lista.style.display === 'none' || lista.style.display === '') ? 'block' : 'none';
        }
    }

    function renderizarMaquinas() {
        const container = document.getElementById('maquinas_container');
        container.innerHTML = '';

        if (maquinasAdicionadas.length === 0) {
            container.innerHTML = '<p class="text-muted">Nenhuma máquina adicionada.</p>';
            return;
        }

        const summaryLink = document.createElement('a');
        summaryLink.href = 'javascript:void(0);';
        summaryLink.className = 'summary-link mb-2 d-inline-block';
        summaryLink.onclick = toggleListaMaquinas;
        summaryLink.innerHTML = `<i class="bi bi-hdd-stack"></i> <strong>${maquinasAdicionadas.length}</strong> máquinas adicionadas (clique para ver/ocultar)`;
        container.appendChild(summaryLink);

        const listContainer = document.createElement('div');
        listContainer.id = 'lista-maquinas-detalhes';
        listContainer.style.display = 'none';

        maquinasAdicionadas.forEach((maq, index) => {
            const div = document.createElement('div');
            div.className = 'machine-card';
            div.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <strong>Máquina:</strong> ${maq.nom_maq} | <strong>Jogo:</strong> ${maq.nom_jogo}<br>
                        <small><strong>Placa:</strong> ${maq.numeroPlaca || '-'} | <strong>Obs:</strong> ${maq.obs || '-'}</small>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerMaquina(${index})">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
                <hr class="my-2">
                <small><strong>Leitura:</strong> E: ${maq.entrada || '0'} | S: ${maq.saida || '0'}</small>
            `;
            listContainer.appendChild(div);
        });

        container.appendChild(listContainer);
    }

    /* ========= AÇÕES ========= */
    function adicionarMaquina() {
        const nome = document.getElementById('maq_nome').value;
        const jogo = document.getElementById('maq_jogo').value;
        const placa = document.getElementById('maq_placa').value;
        const obs = document.getElementById('maq_obs').value;
        const entrada = document.getElementById('Entrada').value;
        const saida = document.getElementById('Saida').value;

        if (!nome || !jogo) {
            alert('Preencha pelo menos o Nº da Máquina e o Nome do Jogo.');
            return;
        }

        const maquina = {
            nom_maq: nome,
            nom_jogo: jogo,
            numeroPlaca: placa,
            obs: obs,
            entrada: entrada,
            saida: saida
        };

        maquinasAdicionadas.push(maquina);
        renderizarMaquinas();

        // Limpa campos do formulário da máquina
        document.getElementById('maq_nome').value = '';
        document.getElementById('maq_jogo').value = '';
        document.getElementById('maq_placa').value = '';
        document.getElementById('maq_obs').value = '';
        document.getElementById('Entrada').value = '';
        document.getElementById('Saida').value = '';
        document.getElementById('maq_nome').focus();

        // Atualiza ponte
        if (typeof sincronizarPonteExecucao === 'function') {
            try { sincronizarPonteExecucao(); } catch (e) { console.warn(e); }
        }
    }

    function removerMaquina(index) {
        maquinasAdicionadas.splice(index, 1);
        renderizarMaquinas();

        // Atualiza ponte
        if (typeof sincronizarPonteExecucao === 'function') {
            try { sincronizarPonteExecucao(); } catch (e) { console.warn(e); }
        }
    }

    function salvarTudo() {
        const pracaSelecionada = document.getElementById('praca').value;
        const cliente = {
            nomCliente: (document.getElementById('nomCliente').value || '').toUpperCase(),
            logradouro: document.getElementById('logradouro').value,
            bairro: document.getElementById('bairro').value,
            telefone: document.getElementById('telefone').value,
            contato: document.getElementById('contato').value,
            praca: pracaSelecionada,
            leiturista: parseInt((pracaSelecionada || '').replace('V', '')) || null,
            regiao: parseInt(document.getElementById('regiao').value),
            ativo: true,
            dtCadastro: new Date().toISOString()
        };

        if (!cliente.nomCliente || !cliente.logradouro || !cliente.bairro) {
            alert('Por favor, preencha todos os dados do cliente.');
            return;
        }

        const payload = {
            cliente: cliente,
            maquinas: maquinasAdicionadas.map(m => ({
                // Envia apenas o que o backend espera
                nom_maq: m.nom_maq,
                nom_jogo: m.nom_jogo,
                numeroPlaca: m.numeroPlaca,
                obs: m.obs
            }))
        };

        fetch('/api/cadastros/cliente-com-maquinas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.ok) {
                // Volta pra tela de execução, levando o resumo direto na URL
                // (em vez de localStorage, que ficava "vazando" entre abas/execuções diferentes)
                const params = new URLSearchParams(window.location.search);
                const solicitacaoId = params.get('solicitacaoId');
                const idProblema = params.get('idProblema');
                const tecnico = params.get('tecnico') || '';
                const texto = montarResumoInstalacao();

                if (solicitacaoId && idProblema) {
                    const qs = new URLSearchParams({
                        solicitacaoId: solicitacaoId,
                        idProblema: idProblema,
                        tecnico: tecnico,
                        resumoInstalacao: texto
                    }).toString();
                    window.location.href = '/form_execucao?' + qs;
                } else {
                    // Não veio de uma execução (acesso direto pelo menu/dashboard) — volta pro menu
                    alert('Cliente e máquinas cadastrados com sucesso!');
                    window.location.href = '/menu';
                }
            } else {
                return response.text().then(text => {
                    throw new Error(text || ('Status ' + response.status));
                });
            }
        })
        .catch(err => {
            console.error('Erro ao cadastrar:', err);
            alert('Erro ao cadastrar: ' + (err && err.message ? err.message : err));
        });
    }

    /* ========= PONTE COM O FORM_EXECUCAO (localStorage) ========= */
    const BRIDGE_KEY = 'form_execucao_o_que_foi_feito';

    /** Monta um texto-resumo formatado no padrão solicitado */
    function montarResumoInstalacao() {
        // Dados do cliente
        const nomCliente = (document.getElementById('nomCliente').value || '').trim();
        const logradouro = (document.getElementById('logradouro').value || '').trim();
        const bairro = (document.getElementById('bairro').value || '').trim();
        const telefone = (document.getElementById('telefone').value || '').trim();
        const contato = (document.getElementById('contato').value || '').trim();
        const praca = (document.getElementById('praca').value || '').trim();

        // Cabeçalho no formato do exemplo
        let resumo = `NOVO PONTO \n`;
        resumo += `${nomCliente || '-'}\n`;
        resumo += `${logradouro || '-'} - ${bairro || '-'}\n`;
        resumo += `Contato: ${contato || '-'}\n`;
        resumo += `Tel.: ${telefone || '-'}\n`;
        resumo += `Praça: ${praca || '-'}\n\n`;

        // Máquinas (LEITURA INICIAL)
        if (Array.isArray(maquinasAdicionadas) && maquinasAdicionadas.length > 0) {
            resumo += `LEITURA INICIAL \n`;
            maquinasAdicionadas.forEach((m, i) => {
                const num = m.nom_maq || '-';
                const jogo = m.nom_jogo || '-';
                const e = (m.entrada ?? '').toString().trim() || '0';
                const s = (m.saida ?? '').toString().trim() || '0';
                const placa = m.numeroPlaca || '-';
                const obs = (m.obs || '').toString().trim();

                resumo += `Maq.${num} - ${jogo} \n`;
                resumo += `E-${e}\n`;
                resumo += `S-${s}\n`;
                resumo += `Pl.: ${placa}\n`;
                if (obs) resumo += `${obs}\n`;

                if (i < maquinasAdicionadas.length - 1) resumo += `\n`;
            });
        } else {
            resumo += `Máquinas: (nenhuma adicionada)\n`;
        }

        return resumo;
    }

    /** Escreve/atualiza o texto no localStorage para o Form_execucao capturar */
    function sincronizarPonteExecucao() {
        try {
            const texto = montarResumoInstalacao();
            localStorage.setItem(BRIDGE_KEY, texto);
        } catch (e) {
            console.warn('Falha ao sincronizar ponte com o Form_execucao:', e);
        }
    }


</script>

</body>
</html>
