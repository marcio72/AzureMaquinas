<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Cadastro de Cliente - Sistema Pro</title>
	
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
	
	<style>
		:root {
		   --bg-body: #081418; --bg-card: #10242a; --primary-green: #1ee4ac;
		   --accent-blue: #3d8bff; --text-white: #ffffff; --text-gray: #8ea1a7;
		   --border-color: rgba(255, 255, 255, 0.1);
		}
 
		body {
		   background-color: var(--bg-body) !important;
		   color: var(--text-white);
		   font-family: 'Inter', sans-serif;
		}
 
		.card-custom {
		   background: var(--bg-card);
		   border-radius: 24px;
		   border: 1px solid var(--border-color);
		   box-shadow: 0 15px 35px rgba(0,0,0,0.4);
		}
 
		.form-label {
		   color: var(--text-gray);
		   font-size: 11px;
		   font-weight: 700;
		   text-transform: uppercase;
		   margin-bottom: 8px;
		}
 
		.input-group-text {
		   background: rgba(255, 255, 255, 0.05) !important;
		   border: 1px solid var(--border-color) !important;
		   color: white !important; /* Ícones brancos corrigidos */
		   border-radius: 12px 0 0 12px;
		}
 
		.form-control, .form-select {
		   background-color: rgba(255, 255, 255, 0.05) !important;
		   border: 1px solid var(--border-color) !important;
		   color: white !important;
		   padding: 12px;
		   border-radius: 0 12px 12px 0;
		}
 
		/* Remove o branco do autofill */
		input:-webkit-autofill {
		   -webkit-text-fill-color: white !important;
		   -webkit-box-shadow: 0 0 0px 1000px var(--bg-card) inset !important;
		}
 
		/* BOTOES CORRIGIDOS PARA APARECEREM NO DARK */
		.btn-save {
		   background: var(--primary-green) !important;
		   color: #081418 !important; /* Texto escuro para contraste no verde */
		   font-weight: 700;
		   border-radius: 12px;
		   padding: 12px 30px;
		   border: none;
		   display: flex;
		   align-items: center;
		   gap: 8px;
		}
 
		.btn-cancel {
		   background: #334155 !important; /* Cinza azulado sólido para ser visível */
		   color: white !important;
		   border: 1px solid rgba(255,255,255,0.1);
		   border-radius: 12px;
		   padding: 12px 25px;
		   text-decoration: none;
		   display: flex;
		   align-items: center;
		   gap: 8px;
		}
 
		.btn-save:hover { background: #19c596 !important; }
		.btn-cancel:hover { background: #475569 !important; }
	</style>
</head>
<body>

<div th:replace="~{fragments/menu :: layout(~{::section})}">
	<section class="container py-4">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				
				<div class="mb-4">
					<h2 class="fw-bold m-0" th:text="${cliente.codCliente == null ? 'Novo Cliente' : 'Editar Cliente'}"></h2>
				</div>
				
				<div class="card-custom">
					<div class="card-body p-4 p-md-5">
						<form method="post" th:action="@{/clientes/salvar}" th:object="${cliente}">
							<input type="hidden" th:field="*{codCliente}" />
							
							<div class="row g-4">
								<div class="col-md-12">
									<label class="form-label">Nome do Ponto</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
										<input type="text" class="form-control" th:field="*{nomCliente}" required autocomplete="off">
									</div>
								</div>
								
								<div class="col-md-8">
									<label class="form-label">Logradouro</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
										<input type="text" class="form-control" th:field="*{logradouro}" required autocomplete="off">
									</div>
								</div>
								
								<div class="col-md-4">
									<label class="form-label">Bairro</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-buildings"></i></span>
										<input type="text" class="form-control" th:field="*{bairro}" required autocomplete="off">
									</div>
								</div>
								
								<div class="col-md-4">
									<label class="form-label">Região</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-map"></i></span>
										<select class="form-select" th:field="*{regiao}" required>
											<option value="">Selecione...</option>
											<option value="1">Norte</option>
											<option value="2">Sul</option>
											<option value="3">Leste</option>
											<option value="4">Oeste</option>
											<option value="5">Centro</option>
											<option value="6">ABC</option>
										</select>
									</div>
								</div>
								
								<div class="col-md-4">
									<label class="form-label">Telefone</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-whatsapp"></i></span>
										<input type="text" class="form-control" th:field="*{telefone}" required autocomplete="off">
									</div>
								</div>
								
								<div class="col-md-4">
									<label class="form-label">Contato</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-person-badge"></i></span>
										<input type="text" class="form-control" th:field="*{contato}" required autocomplete="off">
									</div>
								</div>
							</div>
							
							<div class="mt-5 d-flex justify-content-end gap-3">
								<a href="/clientes/listar" class="btn btn-cancel">
									<i class="bi bi-x-circle"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-save">
									<i class="bi bi-check-circle"></i> Salvar Cliente
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
