<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Cadastro de Máquina - Sistema Pro</title>
	
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
	
	<style>
		:root {
		   --bg-body: #081418; --bg-card: #10242a; --primary-green: #1ee4ac;
		   --text-white: #ffffff; --text-gray: #8ea1a7; --border-color: rgba(255, 255, 255, 0.1);
		}
 
		body {
		   background-color: var(--bg-body) !important;
		   color: var(--text-white);
		   font-family: 'Inter', sans-serif;
		}
 
		.card-custom {
		   background: var(--bg-card);
		   border-radius: 24px;
		   border: 1px solid var(--border-color);
		   box-shadow: 0 15px 35px rgba(0,0,0,0.4);
		}
 
		.form-label {
		   color: var(--text-gray);
		   font-size: 11px;
		   font-weight: 700;
		   text-transform: uppercase;
		   margin-bottom: 8px;
		}
 
		/* Ícones brancos e campos dark */
		.input-group-text {
		   background: rgba(255, 255, 255, 0.05) !important;
		   border: 1px solid var(--border-color) !important;
		   color: white !important;
		   border-radius: 12px 0 0 12px;
		}
 
		.form-control, .form-select {
		   background-color: rgba(255, 255, 255, 0.05) !important;
		   border: 1px solid var(--border-color) !important;
		   color: white !important;
		   padding: 12px;
		   border-radius: 0 12px 12px 0;
		}
 
		.form-select {
		   background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%238ea1a7' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
		}
 
		.form-select option { background-color: var(--bg-card); color: white; }
 
		/* Ajuste para textarea */
		textarea.form-control { border-radius: 12px !important; }
 
		/* Botões com contraste corrigido */
		.btn-save {
		   background: var(--primary-green) !important;
		   color: #081418 !important;
		   font-weight: 700;
		   border-radius: 12px;
		   padding: 12px 30px;
		   border: none;
		}
 
		.btn-cancel {
		   background: #334155 !important;
		   color: white !important;
		   border-radius: 12px;
		   padding: 12px 25px;
		   text-decoration: none;
		}
 
		/* Peças da máquina (estoque / avulsa) */
		.bloco-pecas { padding: 18px; border-radius: 16px; background: rgba(0,0,0,0.15); border: 1px solid var(--border-color); }
		.bloco-pecas h6 { font-weight: 700; margin-bottom: 4px; }
		.pecas-ajuda { color: var(--text-gray); font-size: 13px; margin-bottom: 12px; }
		.pecas-ajuda b { color: #c4d2d6; }
		.obrig { color: var(--primary-green); font-weight: 700; }
		.peca-row { padding: 10px 0; border-top: 1px dashed var(--border-color); }
		.peca-row:first-child { border-top: none; padding-top: 0; }
		.peca-row .peca-nome { font-weight: 600; font-size: 14px; }
		.peca-row .peca-cat { color: var(--text-gray); font-size: 12px; }
		.peca-avulsa { margin-top: 8px; padding: 10px; border-radius: 10px;
		               background: rgba(255,176,32,0.06); border: 1px solid rgba(255,176,32,0.25); }
		.tag-avulsa { color: #ffb020; }
		.peca-erro { color: #ff6b6b; font-size: 13px; }
		#pecas_box .form-control, #pecas_box .form-select, .campo-solto { border-radius: 12px !important; padding: 9px 12px; }
		.msg-erro { color: #ff8a8a; }

		/* Responsividade Mobile */
		@media (max-width: 576px) {
		   .btn-group-mobile { flex-direction: column-reverse; gap: 10px; }
		   .btn-group-mobile a, .btn-group-mobile button { width: 100%; text-align: center; }
		}
	</style>
</head>
<body>

<div th:replace="~{fragments/menu :: layout(~{::section})}">
	<section class="container py-4">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				
				<div class="mb-4">
					<h2 class="fw-bold m-0"><i class="bi bi-plus-circle text-success me-2"></i> Cadastro de Máquina</h2>
					<p class="text-secondary small">Vincule equipamentos aos pontos de atendimento.</p>
				</div>
				
				<div class="card-custom">
					<div class="card-body p-4 p-md-5">
						<form id="formMaquina" autocomplete="off" novalidate>
							
							<div class="row g-4">
								<div class="col-md-12">
									<label class="form-label">Ponto / Cliente Responsável</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-person-check"></i></span>
										<select class="form-select" id="codCliente" required>
											<option value="" disabled selected>Selecione o Cliente</option>
											<option th:each="cliente : ${clientes}"
													th:value="${cliente.codCliente}"
													th:text="${cliente.nomCliente}">
											</option>
										</select>
									</div>
								</div>
								
								<div class="col-md-6">
									<label class="form-label">Identificação / Nome da Máquina</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-cpu"></i></span>
										<input type="text" class="form-control" id="nom_maq" maxlength="15" placeholder="Ex: 101" required autocomplete="off">
									</div>
								</div>
								
								<div class="col-md-6">
									<label class="form-label">Software / Jogo Instalado</label>
									<div class="input-group">
										<span class="input-group-text"><i class="bi bi-controller"></i></span>
										<input type="text" class="form-control" id="nom_jogo" maxlength="25" placeholder="Ex: Halloween 20 (a peça Jogo do catálogo preenche)" autocomplete="off">
									</div>
								</div>
								
								<!-- O Nº da placa agora vem da peça Placa escolhida abaixo -->

								<div class="col-md-6">
									<label class="form-label">Leitura inicial — Entrada</label>
									<input type="text" class="form-control campo-solto" id="entrada" inputmode="numeric" maxlength="9" placeholder="0">
								</div>

								<div class="col-md-6">
									<label class="form-label">Leitura inicial — Saída</label>
									<input type="text" class="form-control campo-solto" id="saida" inputmode="numeric" maxlength="9" placeholder="0">
								</div>

								<div class="col-md-12">
									<div class="bloco-pecas">
										<h6><i class="bi bi-cpu me-1"></i> Peças da máquina</h6>
										<div class="pecas-ajuda">
											Escolha a peça do <b>estoque</b> ou marque <b>avulsa</b> para uma peça que já está
											na máquina e nunca entrou no estoque. <span class="obrig">*</span> obrigatória.
										</div>
										<div id="pecas_box"><p class="text-secondary mb-0">Carregando peças do estoque…</p></div>
									</div>
								</div>

								<div class="col-md-12">
									<label class="form-label">Informações Adicionais</label>
									<textarea class="form-control" id="obs" rows="3" maxlength="255" placeholder="Detalhes técnicos ou observações..."></textarea>
								</div>

								<div class="col-md-12">
									<div id="msgForm" class="small"></div>
								</div>
							</div>
							
							<div class="mt-5 d-flex justify-content-end gap-3 btn-group-mobile">
								<a href="/form-maquinas" class="btn btn-cancel">
									<i class="bi bi-arrow-left"></i> Voltar
								</a>
								<button type="submit" class="btn btn-save">
									<i class="bi bi-cloud-arrow-up me-2"></i> Salvar Equipamento
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/pecas-maquina.js"></script>
<script>
	(function () {
		const $ = id => document.getElementById(id);

		PecasMaquina.init('pecas_box', {
			onJogo: nome => { if (!$('nom_jogo').value) $('nom_jogo').value = nome.substring(0, 25); }
		});

		function mostrar(msg, erro) {
			$('msgForm').className = 'small ' + (erro ? 'msg-erro' : 'text-success');
			$('msgForm').textContent = msg || '';
		}

		async function salvar(confirmarDuplicado) {
			mostrar('');
			const codCliente = $('codCliente').value;
			const nome = $('nom_maq').value.trim();
			const jogo = $('nom_jogo').value.trim();
			const entrada = $('entrada').value.trim();
			const saida = $('saida').value.trim();

			if (!codCliente) return mostrar('Selecione o cliente.', true);
			if (!nome) return mostrar('Informe o número da máquina.', true);
			if ((entrada && !/^\d{1,9}$/.test(entrada)) || (saida && !/^\d{1,9}$/.test(saida))) {
				return mostrar('Entrada e Saída: use só números.', true);
			}
			const pecas = PecasMaquina.ler();
			if (!pecas.ok) return mostrar(pecas.erro, true);
			if (!jogo && !pecas.resumo.JOGO) return mostrar('Informe o jogo (ou escolha a peça Jogo).', true);

			const btn = document.querySelector('#formMaquina .btn-save');
			btn.disabled = true;
			try {
				const resp = await fetch('/api/cadastro-maquina/maquina', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					credentials: 'same-origin',
					body: JSON.stringify({
						codCliente: Number(codCliente),
						confirmarDuplicado: !!confirmarDuplicado,
						maquina: {
							nomMaq: nome, nomJogo: jogo, obs: $('obs').value.trim(),
							entrada: entrada, saida: saida, pecas: pecas.pecas
						}
					})
				});
				const corpo = await resp.json().catch(() => ({}));
				if (resp.ok) {
					alert(corpo.mensagem || 'Máquina cadastrada.');
					window.location.href = '/maquinas/form';
					return;
				}
				if (resp.status === 409 && corpo.precisaConfirmar) {
					btn.disabled = false;
					if (confirm(corpo.erro)) salvar(true);
					return;
				}
				if (resp.status === 401) {
					mostrar(corpo.erro || 'Sessão expirada.', true);
					setTimeout(() => window.location.href = '/login', 1500);
					return;
				}
				mostrar(corpo.erro || ('Erro ' + resp.status), true);
			} catch (e) {
				mostrar('Erro ao salvar: ' + e.message, true);
			}
			btn.disabled = false;
		}

		$('formMaquina').addEventListener('submit', ev => { ev.preventDefault(); salvar(false); });
	})();
</script>
</body>
</html>
