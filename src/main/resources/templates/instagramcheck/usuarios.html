<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários · Checagem de Perfis Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F7F6; --surface:#FFFFFF; --border:#DCE6E3; --border-soft:#E9F0EE; --text:#182625; --text-muted:#647672;
    --teal:#0D7C77; --teal-dark:#0A5F5B; --teal-tint:#E1F2F0; --teal-tint-strong:#CDEAE6;
    --plum:#733A61; --plum-dark:#582948; --plum-tint:#F4E7F0;
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(16,36,33,.06); --shadow-md:0 8px 24px rgba(16,36,33,.10);
    --font-display:'Manrope',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  #app{max-width:720px; margin:0 auto; padding:28px 20px 64px;}
  header{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  h1{font-family:var(--font-display); font-weight:800; font-size:1.4rem; margin:0;}
  .link-voltar{color:var(--teal-dark); font-weight:600; font-size:.86rem; text-decoration:none;}
  .card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); padding:20px; margin-bottom:22px;}
  .erro{background:var(--plum-tint); color:var(--plum-dark); border-radius:var(--radius-sm); padding:10px 14px; font-size:.86rem; margin-bottom:16px;}
  table{width:100%; border-collapse:collapse; font-size:.88rem;}
  th{text-align:left; padding:9px 8px; color:var(--text-muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border);}
  td{padding:10px 8px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  .badge{padding:3px 10px; border-radius:99px; font-size:.72rem; font-weight:700;}
  .badge.ativo{background:var(--teal-tint-strong); color:var(--teal-dark);}
  .badge.inativo{background:var(--border-soft); color:var(--text-muted);}
  .form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .form-group{flex:1; min-width:160px;}
  label{display:block; font-size:.78rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;}
  input[type=text], input[type=password]{
    width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    font-family:var(--font-body); font-size:.9rem;
  }
  .btn{font-family:var(--font-body); font-weight:600; font-size:.84rem; padding:9px 16px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
  .btn-teal{background:var(--teal); border-color:var(--teal); color:#fff;}
  .btn-teal:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent; color:var(--plum-dark); padding:6px 10px; font-size:.78rem;}
  .inline-form{display:inline;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Usuários com acesso</h1>
    <a class="link-voltar" th:href="@{/checagem-instagram}">&larr; Voltar pra checagem</a>
  </header>

  <div class="card">
    <div class="erro" th:if="${erro}" th:text="${erro}"></div>
    <form method="post" th:action="@{/checagem-instagram/usuarios}">
      <div class="form-row">
        <div class="form-group">
          <label for="username">Novo usuário</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>
        <button type="submit" class="btn btn-teal">Cadastrar</button>
      </div>
    </form>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Usuário</th><th>Status</th><th>Criado em</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.username}"></td>
          <td><span class="badge" th:classappend="${u.ativo} ? 'ativo' : 'inativo'" th:text="${u.ativo} ? 'Ativo' : 'Inativo'"></span></td>
          <td th:text="${#temporals.format(u.criadoEm, 'dd/MM/yyyy HH:mm')}"></td>
          <td>
            <form class="inline-form" method="post" th:action="@{'/checagem-instagram/usuarios/' + ${u.id} + '/alternar'}">
              <button type="submit" class="btn btn-ghost" th:text="${u.ativo} ? 'Desativar' : 'Ativar'"></button>
            </form>
            <form class="inline-form" method="post" th:action="@{'/checagem-instagram/usuarios/' + ${u.id} + '/excluir'}"
                  onsubmit="return confirm('Remover este usuário?');">
              <button type="submit" class="btn btn-ghost">Excluir</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
