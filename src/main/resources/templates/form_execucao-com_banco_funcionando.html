<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Execução de Manutenção</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    .btn-roxo { background-color: #5a32a3; color: #fff; border: none; }
    .btn-roxo:hover { background-color: #6f42c1; }
    .troca-form {
      margin-top: 12px;
      padding: 12px;
      background-color: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #ced4da;
    }
    .estoque-info {
      margin-top: 6px;
      font-size: .85rem;
      color: #333;
    }
  </style>
</head>

<body class="bg-light">
<div class="container py-5">
  <div class="card shadow rounded-4">

    <div class="card-header bg-success text-white d-flex justify-content-between">
      <h5 class="mb-0"><i class="bi bi-check2-square"></i> Execução de Serviço</h5>
    </div>

    <div class="card-body">

      <!-- impede submit padrão -->
      <form id="form_execucao">


      <!-- SELECT SOLICITAÇÃO -->
        <div class="mb-3">
          <label class="form-label">Selecione o Serviço</label>
          <select id="solicitacao_cliente" class="form-select" onchange="atualizarFormulario()">
            <option disabled selected>Carregando...</option>
          </select>
        </div>

        <!-- MODAL DE INSTALAÇÃO -->
        <div class="modal fade" id="modalInstalacao" tabindex="-1">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

              <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="bi bi-info-circle"></i> Pedido de Instalação</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">
                <strong>Detalhes:</strong>
                <div id="detalhes-instalacao" class="border rounded p-2 bg-light"></div>
              </div>

              <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        onclick="fecharPedidoInstalacao()" data-bs-dismiss="modal">
                  Fechar
                </button>
              </div>

            </div>
          </div>
        </div>

        <!-- FORM DE MANUTENÇÃO -->
        <div id="form-manutencao">

          <div class="row mb-3">
            <div class="col-md-10">
              <label class="form-label">Máquina</label>
              <select id="maquina_execucao_select" class="form-select" disabled>
                <option disabled selected>Escolha uma máquina</option>
              </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button type="button" id="btn-adicionar-execucao"
                      class="btn btn-secondary w-100"
                      onclick="adicionarMaquinaExecucao()" disabled>
                <i class="bi bi-plus-circle"></i> Adicionar
              </button>
            </div>
          </div>

          <div id="execucoes_container"></div>

        </div>

        <!-- BOTÃO FINAL -->
        <div class="mt-4 d-flex justify-content-between">
          <a href="/menu" class="btn btn-outline-secondary">Voltar ao Menu</a>

          <button type="button" id="btn-confirmar-execucao"
                  class="btn btn-success"
                  onclick="confirmarExecucoes()" disabled>
            <i class="bi bi-check-circle"></i> Confirmar Execuções
          </button>
        </div>

      </form>

    </div>
  </div>
</div>


<!-- ============================================================
   MODAL UNIVERSAL DO ESTOQUE
=============================================================== -->
<div class="modal fade" id="modalEstoque" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="bi bi-box-seam"></i> Selecionar Peça do Estoque</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Categoria</label>
            <select id="modal_categoria_estoque" class="form-select" onchange="carregarPecasModal()">
              <option disabled selected>Carregando...</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Peça Disponível</label>
            <select id="modal_peca_estoque" class="form-select">
              <option disabled selected>Selecione a categoria</option>
            </select>
          </div>
        </div>

        <div class="alert alert-info small">
          A peça selecionada será vinculada diretamente ao subformulário da troca.
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="selecionarPecaDoEstoque()">
          <i class="bi bi-check2-circle"></i> Selecionar Peça
        </button>
      </div>

    </div>
  </div>
</div>



<!-- ============================================================
   SCRIPT GERAL
=============================================================== -->
<script>
  let solicitacoes = {};
  let blocoEstoqueAtual = null;
  let tipoTrocaAtual = null;

  /* ============================================================
     ONLOAD
  =============================================================== */
  window.onload = () => {
  carregarSolicitacoes();
  carregarCategoriasModal();

  const f = document.getElementById("form_execucao");
  if (f) {
    f.addEventListener("submit", e => {
      e.preventDefault();
    });
  }
};


  /* ============================================================
     1) CARREGAR SOLICITAÇÕES
  =============================================================== */
  function carregarSolicitacoes() {
    fetch('/api/solicitacao')
      .then(r => r.json())
      .then(data => {
        const select = document.getElementById('solicitacao_cliente');
        select.innerHTML = '<option disabled selected>Selecione...</option>';

        data.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.text = s.cliente;
          solicitacoes[s.id] = s;
          select.appendChild(opt);
        });
      })
      .catch(err => {
        console.error(err);
        alert('Erro ao carregar solicitações.');
      });
  }

  /* ============================================================
     2) ATUALIZAR FORMULÁRIO AO TROCAR SOLICITAÇÃO
  =============================================================== */
  function atualizarFormulario() {
    const id = document.getElementById('solicitacao_cliente').value;
    const servicoTexto = document.getElementById('solicitacao_cliente')
          .selectedOptions[0].text.toUpperCase();

    document.getElementById('execucoes_container').innerHTML = '';

    const form = document.getElementById('form-manutencao');
    const maquinas = document.getElementById('maquina_execucao_select');
    const btnAdd = document.getElementById('btn-adicionar-execucao');
    const btnConf = document.getElementById('btn-confirmar-execucao');

    if (servicoTexto.includes("INSTALAÇÃO")) {
      // só mostra modal com detalhes
      form.style.display = "none";
      abrirModalInstalacao(id);
    } else {
      form.style.display = "block";
      maquinas.disabled = false;
      btnAdd.disabled = false;
      btnConf.disabled = false;

      maquinas.innerHTML = '<option disabled selected>Escolha...</option>';

      solicitacoes[id].problemas.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.idProblema;
        opt.text = p.maquina;
        opt.dataset.descricao = p.descricao;
        maquinas.appendChild(opt);
      });
    }
  }

  /* ============================================================
     INSTALAÇÃO
  =============================================================== */
  function abrirModalInstalacao(id) {
    const s = solicitacoes[id];
    document.getElementById('detalhes-instalacao').innerHTML =
      `<strong>Cliente:</strong> ${s.cliente}<br>
       <strong>Endereço:</strong> ${s.endereco}`;

    new bootstrap.Modal('#modalInstalacao').show();
  }

  function fecharPedidoInstalacao() {
    document.getElementById('form-manutencao').style.display = "block";
  }

  /* ============================================================
     4) ADICIONAR BLOCO DE EXECUÇÃO
  =============================================================== */
  function adicionarMaquinaExecucao() {

    const select = document.getElementById('maquina_execucao_select');
    const idProblema = select.value;

    if (!idProblema || document.getElementById("execucao_" + idProblema)) return;

    const nome = select.selectedOptions[0].text;
    const desc = select.selectedOptions[0].dataset.descricao;

    const bloco = document.createElement('div');
    bloco.className = "execucao-bloco mb-3 p-3 border rounded bg-light";
    bloco.id = "execucao_" + idProblema;

    const agora = new Date().toISOString().slice(0,16);

    bloco.innerHTML = `
      <label class="fw-bold">${nome} - <span class="text-danger">${desc}</span></label>

      <div class="row mb-2">
        <div class="col-md-4">
          <label class="form-label small">Data Execução</label>
          <input type="datetime-local" class="form-control"
                 name="data_execucao_${idProblema}" value="${agora}">
        </div>
        <div class="col-md-4">
          <label class="form-label small">Técnico</label>
          <input type="text" class="form-control" name="tecnico_${idProblema}">
        </div>
      </div>

      <label class="form-label small">O que foi feito</label>
      <textarea class="form-control" rows="4"
                name="descricao_execucao_${idProblema}"></textarea>

      <div class="mt-2 d-flex flex-wrap gap-2">
              <select id="categoria_estoque" class="form-select" disabled>
                <option disabled selected>Escolha da Troca</option>
              </select>
        <button type="button" class="btn btn-sm btn-roxo"
                onclick="abrirTrocaJogo(this)">Troca de Jogo</button>

        <button type="button" class="btn btn-sm btn-roxo"
                onclick="abrirTrocaPlaca(this)">Troca de Placa</button>

        <button type="button" class="btn btn-sm btn-roxo"
                onclick="abrirTrocaMonitor(this)">Troca de Monitor</button>

        <button type="button" class="btn btn-sm btn-roxo"
                onclick="abrirTrocaColetor(this)">Troca de Coletor</button>
      </div>
    `;

    document.getElementById('execucoes_container').appendChild(bloco);
  }


  /* ===============================================================
        TROCA DE JOGO
    ===============================================================*/
function abrirTrocaJogo(botao) {
    const container = botao.closest('.execucao-bloco');
    if (container.querySelector('.troca-jogo-form')) return;

    const div = document.createElement('div');
    div.className = 'troca-jogo-form';
    div.innerHTML = `
      <div class="row mb-2">
        <div class="col-md-6">
          <strong>Leitura Final:</strong><br>
          <div class="input-group mt-1">
            <span class="input-group-text">Entrada</span>
            <input type="text" class="form-control entrada-final">
            <span class="input-group-text">Saída</span>
            <input type="text" class="form-control saida-final">
          </div>
        </div>
        <div class="col-md-6">
          <strong>Leitura Inicial:</strong><br>
          <input type="text" class="form-control form-control-sm mt-1 nome-inicial" placeholder="Novo nome do jogo">
          <div class="input-group mt-1">
            <span class="input-group-text">Entrada</span>
            <input type="text" class="form-control entrada-inicial" value="0000">
            <span class="input-group-text">Saída</span>
            <input type="text" class="form-control saida-inicial" value="0000">
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-sm btn-primary" onclick="transferirTrocaJogo(this)">Transferir</button>
    `;
    container.appendChild(div);
  }

  function transferirTrocaJogo(botao) {
    const form = botao.closest('.troca-jogo-form');
    const container = botao.closest('.execucao-bloco');


      const label = container.querySelector('label.form-label');
      const fullText = label?.childNodes[0]?.textContent.trim() || "";
      const partes = fullText.split('-');
      const nomeJogo = partes.length > 1 ? partes[1].trim() : fullText;


    const entradaFinal = form.querySelector('.entrada-final').value;
    const saidaFinal = form.querySelector('.saida-final').value;
    const nomeInicial = form.querySelector('.nome-inicial').value;
    const entradaInicial = form.querySelector('.entrada-inicial').value;
    const saidaInicial = form.querySelector('.saida-inicial').value;

    const texto = `TROCA DE JOGO\n${nomeJogo}
\nLeitura Final
Entrada : ${entradaFinal}
Saída : ${saidaFinal}
\nLeitura Inicial\n${nomeInicial}
Entrada : ${entradaInicial}
Saída : ${saidaInicial}`;

    const textarea = container.querySelector("textarea");
    textarea.value += (textarea.value ? "\n\n" : "") + texto;

    form.style.display = "none";
  }

  /* ============================================================
     TROCA DE PLACA
  =============================================================== */
  function abrirTrocaPlaca(btn) {
    const bloco = btn.closest(".execucao-bloco");
    if (bloco.querySelector(".troca-form.troca-placa")) return;

    bloco.insertAdjacentHTML("beforeend", `
      <div class="troca-form troca-placa">

        <strong>TROCA DE PLACA</strong>

        <div class="input-group mt-2">
          <span class="input-group-text">Ant.</span>
          <input class="form-control placa-antiga" value="S/N">

          <span class="input-group-text">Nova</span>
          <input class="form-control placa-nova">
        </div>

        <button type="button"
                class="btn btn-outline-primary btn-sm mt-2"
                onclick="abrirModalEstoque(this,'PLACA')">
          <i class="bi bi-box"></i> Escolher peça do estoque
        </button>

        <div class="estoque-info"></div>

        <input type="hidden" class="id-peca-estoque">

        <button type="button"
                class="btn btn-primary btn-sm mt-3"
                onclick="transferirTrocaPlaca(this)">
          Transferir
        </button>

      </div>
    `);
  }

  function transferirTrocaPlaca(btn) {
    const form = btn.closest(".troca-form");
    const bloco = btn.closest(".execucao-bloco");
    const textarea = bloco.querySelector("textarea");

textarea.value += `TROCA DE PLACA
Ret.: ${form.querySelector('.placa-antiga').value}
Rep.: ${form.querySelector('.placa-nova').value}
`;
    form.style.display = "none";
  }

  /* ============================================================
     TROCA DE MONITOR
  =============================================================== */
  function abrirTrocaMonitor(btn) {
    const bloco = btn.closest(".execucao-bloco");
    if (bloco.querySelector(".troca-form.troca-monitor")) return;

    bloco.insertAdjacentHTML("beforeend", `
      <div class="troca-form troca-monitor">

        <strong>TROCA DE MONITOR</strong>

        <div class="input-group mt-2">
          <span class="input-group-text">Ant.</span>
          <input class="form-control monitor-antigo" value="S/N">

          <span class="input-group-text">Novo</span>
          <input class="form-control monitor-novo">
        </div>

        <button type="button"
                class="btn btn-outline-primary btn-sm mt-2"
                onclick="abrirModalEstoque(this,'MONITOR')">
          <i class="bi bi-box"></i> Escolher peça do estoque
        </button>

        <div class="estoque-info"></div>
        <input type="hidden" class="id-peca-estoque">

        <button type="button"
                class="btn btn-primary btn-sm mt-3"
                onclick="transferirTrocaMonitor(this)">
          Transferir
        </button>

      </div>
    `);
  }

  function transferirTrocaMonitor(btn) {
    const f = btn.closest(".troca-form");
    const bloco = btn.closest(".execucao-bloco");
    const textarea = bloco.querySelector("textarea");

    textarea.value += `TROCA DE MONITOR
Ret.: ${f.querySelector('.monitor-antigo').value}
Rep.: ${f.querySelector('.monitor-novo').value}
`;
    f.style.display = "none";

  }

  /* ============================================================
     TROCA DE COLETOR
  =============================================================== */
  function abrirTrocaColetor(btn) {
    const bloco = btn.closest(".execucao-bloco");
    if (bloco.querySelector(".troca-form.troca-coletor")) return;

    bloco.insertAdjacentHTML("beforeend", `
      <div class="troca-form troca-coletor">

        <strong>TROCA DE COLETOR</strong>

        <div class="input-group mt-2">
          <span class="input-group-text">Ant.</span>
          <input class="form-control coletor-antigo" value="S/N">

          <span class="input-group-text">Novo</span>
          <input class="form-control coletor-novo">
        </div>

        <button type="button" class="btn btn-outline-primary btn-sm mt-2"
                onclick="abrirModalEstoque(this,'COLETOR')">
          <i class="bi bi-box"></i> Escolher peça do estoque
        </button>

        <div class="estoque-info"></div>
        <input type="hidden" class="id-peca-estoque">

        <button type="button"
                class="btn btn-primary btn-sm mt-3"
                onclick="transferirTrocaColetor(this)">
          Transferir
        </button>
      </div>
    `);
  }

  function transferirTrocaColetor(btn) {
    const f = btn.closest(".troca-form");
    const bloco = btn.closest(".execucao-bloco");
    const textarea = bloco.querySelector("textarea");

    textarea.value += `TROCA DE COLETOR
Ret.: ${f.querySelector('.coletor-antigo').value}
Rep.: ${f.querySelector('.coletor-novo').value}
`;
    f.remove();
  }

  /* ============================================================
     8) CARREGAR CATEGORIAS E PEÇAS DO MODAL
  =============================================================== */
  async function carregarCategoriasModal() {
    try {
      const sel = document.getElementById("modal_categoria_estoque");

      const res = await fetch('/api/categorias');
      const categorias = await res.json();

      sel.innerHTML = '<option disabled selected>Selecione...</option>';

      categorias.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.text = c.nome;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.error(e);
      alert('Erro ao carregar categorias do estoque.');
    }
  }

  async function carregarPecasModal() {
    try {
      const categoriaId = document.getElementById("modal_categoria_estoque").value;
      const sel = document.getElementById("modal_peca_estoque");

      if (!categoriaId) return;

      const res = await fetch(`/api/pecas/disponiveis/${categoriaId}`);
      const pecas = await res.json();

      sel.innerHTML = '<option disabled selected>Selecione a peça</option>';

      pecas.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.idPeca ?? p.id;
        opt.dataset.codigo = p.codigo;
        opt.dataset.lote = p.lote?.idLote ?? p.lote?.id;
        opt.text = `${p.codigo} (Lote ${opt.dataset.lote})`;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.error(e);
      alert('Erro ao carregar peças disponíveis.');
    }
  }

  /* ============================================================
     9) SELECIONAR PEÇA DO ESTOQUE (MODAL)
  =============================================================== */
  function abrirModalEstoque(btn, tipo) {
    blocoEstoqueAtual = btn.closest(".troca-form");
    tipoTrocaAtual = tipo;

    new bootstrap.Modal('#modalEstoque').show();
  }

  function selecionarPecaDoEstoque() {
    const sel = document.getElementById("modal_peca_estoque");
    const opt = sel.selectedOptions[0];
    if (!opt || !blocoEstoqueAtual) return;

    const codigo = opt.dataset.codigo;
    const lote = opt.dataset.lote;
    const idPeca = opt.value;

    blocoEstoqueAtual.querySelector(".estoque-info").innerHTML =
      `Peça selecionada: <strong>${codigo} (Lote ${lote})</strong>`;

    const campoNova =
          blocoEstoqueAtual.querySelector('.placa-nova') ||
          blocoEstoqueAtual.querySelector('.monitor-novo') ||
          blocoEstoqueAtual.querySelector('.coletor-novo');

    if (campoNova) campoNova.value = `${codigo} (Lote ${lote})`;

    blocoEstoqueAtual.querySelector(".id-peca-estoque").value = idPeca;

    bootstrap.Modal.getInstance(document.getElementById('modalEstoque')).hide();
  }

  /* ============================================================
     10) CONFIRMAR EXECUÇÕES (ENVIA PRO BACK)
  =============================================================== */
  function confirmarExecucoes() {

    const solicitacaoId = document.getElementById('solicitacao_cliente').value;
    const blocos = document.querySelectorAll('.execucao-bloco');

    if (!solicitacaoId) {
      alert('Selecione uma solicitação.');
      return;
    }

    const exec = [];

    blocos.forEach(b => {

      const id = b.id.replace("execucao_", "");

      // peças do estoque usadas neste bloco
      const pecasUsadas = [];
      b.querySelectorAll('.id-peca-estoque').forEach(p => {
        if (p.value && !isNaN(p.value)) {
          pecasUsadas.push(Number(p.value));
        }
      });

      exec.push({
        problemaId: parseInt(id),
        solicitacaoId: parseInt(solicitacaoId),
        dataExecucao: b.querySelector(`[name='data_execucao_${id}']`).value,
        tecnico: b.querySelector(`[name='tecnico_${id}']`).value,
        descricao: b.querySelector(`[name='descricao_execucao_${id}']`).value,
        pecasUsadas: pecasUsadas.length > 0 ? pecasUsadas : []
      });
    });

    if (exec.length === 0) {
      alert('Nenhuma execução preenchida.');
      return;
    }

    console.log("JSON enviado para /api/execucoes-com-estoque/registrar:", exec);

    fetch('/api/execucoes-com-estoque/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(exec)
    })
    .then(r => r.json().catch(() => null).then(data => ({ ok: r.ok, data })))
    .then(resp => {
      if (resp.ok) {
        alert("Execuções registradas com sucesso!");
        window.location.reload();
      } else {
        console.error(resp.data);
        alert("Erro ao registrar execuções. Veja o console.");
      }
    })
    .catch(err => {
      console.error(err);
      alert("Erro inesperado ao registrar execuções.");
    });
  }

</script>

</body>
</html>
