<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Fornecedores de Chave - Sistema Pro</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<style>
		:root {
			--bg-body: #081418;
			--bg-card: #10242a;
			--primary-green: #1ee4ac;
			--accent-blue: #3d8bff;
			--accent-red: #ff4d4d;
			--text-white: #ffffff;
			--text-gray: #8ea1a7;
			--border-color: rgba(255, 255, 255, 0.05);
			--input-bg: #081418;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

		body { background-color: var(--bg-body); color: var(--text-white); padding: 15px; }

		.container { max-width: 700px; margin: 0 auto; }

		header { margin-bottom: 25px; }
		.breadcrumb { font-size: 12px; color: var(--text-gray); margin-bottom: 10px; list-style: none; display: flex; gap: 5px; }
		.breadcrumb a { color: var(--primary-green); text-decoration: none; }
		.page-title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

		.card-custom { background: var(--bg-card); border-radius: 24px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; }
		.card-title { font-size: 13px; font-weight: 700; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 15px; }

		.alert { padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
		.alert-ok { background: rgba(30, 228, 172, 0.1); color: var(--primary-green); border: 1px solid rgba(30, 228, 172, 0.2); }
		.alert-erro { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); border: 1px solid rgba(255, 77, 77, 0.2); }

		.top-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
		.btn-custom { padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.2s; border: none; cursor: pointer; }
		.btn-blue { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); border: 1px solid rgba(61, 139, 255, 0.2); }
		.btn-green { background: var(--primary-green); color: #081418; }
		.btn-ghost { background: rgba(255,255,255,0.05); color: var(--text-white); }
		.btn-custom:hover { transform: translateY(-2px); opacity: 0.9; }

		.form-inline { display: flex; gap: 10px; flex-wrap: wrap; }
		.form-inline input {
			flex: 1; min-width: 200px; background: var(--input-bg); border: 1px solid var(--border-color); color: white;
			padding: 12px 16px; border-radius: 12px; font-size: 15px; outline: none;
		}
		.form-inline input:focus { border-color: var(--primary-green); box-shadow: 0 0 12px rgba(30, 228, 172, 0.15); }

		.lista { list-style: none; }
		.lista li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 6px; border-bottom: 1px solid var(--border-color); }
		.lista li:last-child { border-bottom: none; }
		.lista .nome { font-weight: 600; font-size: 15px; }
		.lista .qtd { font-size: 12px; color: var(--text-gray); margin-top: 3px; }
		.acoes { display: flex; gap: 8px; }
		.btn-action { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
		.btn-edit { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); }
		.btn-view { background: rgba(30, 228, 172, 0.1); color: var(--primary-green); }

		.vazio { text-align: center; padding: 30px 10px; color: var(--text-gray); }
	</style>
</head>

<body>

<div class="container">
	<header>
		<ul class="breadcrumb">
			<li><a href="/">Home</a> /</li>
			<li><a href="/chaves">Chaves</a> /</li>
			<li style="color: var(--text-gray)">Fornecedores</li>
		</ul>
		<h1 class="page-title"><span>🏭</span> Fornecedores de Chave</h1>
	</header>

	<div th:if="${sucesso}" class="alert alert-ok"><i class="bi bi-check-circle"></i><span th:text="${sucesso}"></span></div>
	<div th:if="${erro}" class="alert alert-erro"><i class="bi bi-exclamation-triangle"></i><span th:text="${erro}"></span></div>

	<div class="top-actions">
		<a href="/chaves" class="btn-custom btn-blue"><i class="bi bi-key"></i> Voltar para Chaves</a>
	</div>

	<!-- CADASTRO / EDICAO -->
	<div class="card-custom">
		<div class="card-title" th:text="${editando == null} ? 'Novo fornecedor' : 'Editando fornecedor'">Novo fornecedor</div>
		<form th:action="@{/chaves/fornecedores/salvar}" method="post" class="form-inline">
			<input type="hidden" name="id" th:if="${editando != null}" th:value="${editando.id()}">
			<input type="text" name="nome" maxlength="100" required autofocus autocomplete="off"
				   placeholder="Ex: Papaiz"
				   th:value="${editando != null} ? ${editando.nome()} : ''">
			<button type="submit" class="btn-custom btn-green"><i class="bi bi-check-lg"></i> Salvar</button>
			<a th:if="${editando != null}" href="/chaves/fornecedores" class="btn-custom btn-ghost">Cancelar</a>
		</form>
	</div>

	<!-- LISTA -->
	<div class="card-custom">
		<div class="card-title">Cadastrados</div>

		<div class="vazio" th:if="${#lists.isEmpty(fornecedores)}">
			Nenhum fornecedor cadastrado ainda. Comece por Papaiz e PADO.
		</div>

		<ul class="lista" th:unless="${#lists.isEmpty(fornecedores)}">
			<li th:each="f : ${fornecedores}">
				<div>
					<div class="nome" th:text="${f.nome()}"></div>
					<div class="qtd" th:text="${f.totalChaves()} + ' chave(s) cadastrada(s)'"></div>
				</div>
				<div class="acoes">
					<a th:href="@{/chaves(fornecedorId=${f.id()}, status='todas')}" class="btn-action btn-view">
						<i class="bi bi-key"></i> Chaves
					</a>
					<a th:href="@{/chaves/fornecedores(editar=${f.id()})}" class="btn-action btn-edit">
						<i class="bi bi-pencil-square"></i> Editar
					</a>
				</div>
			</li>
		</ul>
	</div>
</div>

</body>
</html>
