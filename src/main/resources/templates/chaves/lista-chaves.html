<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Controle de Chaves - Sistema Pro</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<style>
		:root {
			--bg-body: #081418;
			--bg-card: #10242a;
			--primary-green: #1ee4ac;
			--accent-blue: #3d8bff;
			--accent-red: #ff4d4d;
			--accent-yellow: #ffc94d;
			--text-white: #ffffff;
			--text-gray: #8ea1a7;
			--border-color: rgba(255, 255, 255, 0.05);
			--input-bg: #081418;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

		body { background-color: var(--bg-body); color: var(--text-white); padding: 15px; }

		.container { max-width: 1100px; margin: 0 auto; }

		header { margin-bottom: 25px; }
		.breadcrumb { font-size: 12px; color: var(--text-gray); margin-bottom: 10px; list-style: none; display: flex; gap: 5px; }
		.breadcrumb a { color: var(--primary-green); text-decoration: none; }
		.page-title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

		.card-custom {
			background: var(--bg-card); border-radius: 24px; padding: 20px;
			border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
		}

		.top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
		.btn-group-nav { display: flex; gap: 10px; flex-wrap: wrap; }

		.btn-custom {
			padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; text-decoration: none;
			display: flex; align-items: center; gap: 8px; transition: 0.2s; border: none; cursor: pointer;
		}
		.btn-blue { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); border: 1px solid rgba(61, 139, 255, 0.2); }
		.btn-green { background: var(--primary-green); color: #081418; }
		.btn-ghost { background: rgba(255,255,255,0.05); color: var(--text-white); }
		.btn-custom:hover { transform: translateY(-2px); opacity: 0.9; }

		/* ALERTAS */
		.alert { padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
		.alert-ok { background: rgba(30, 228, 172, 0.1); color: var(--primary-green); border: 1px solid rgba(30, 228, 172, 0.2); }
		.alert-erro { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); border: 1px solid rgba(255, 77, 77, 0.2); }

		/* FILTROS */
		.filtros {
			display: grid; grid-template-columns: 2fr 2fr 1.5fr 1.5fr auto; gap: 10px;
			margin-bottom: 20px; align-items: end;
		}
		.filtro { display: flex; flex-direction: column; gap: 6px; }
		.filtro label { font-size: 11px; font-weight: 600; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; }
		.filtro input, .filtro select {
			background: var(--input-bg); border: 1px solid var(--border-color); color: white;
			padding: 10px 14px; border-radius: 10px; font-size: 14px; outline: none; width: 100%;
		}
		.filtro input:focus, .filtro select:focus { border-color: var(--primary-green); }
		.filtro-botoes { display: flex; gap: 8px; }
		@media (max-width: 767px) { .filtros { grid-template-columns: 1fr 1fr; } .filtro-botoes { grid-column: span 2; } .filtro-botoes .btn-custom { flex: 1; justify-content: center; } }

		.resumo { font-size: 13px; color: var(--text-gray); margin-bottom: 12px; }
		.resumo strong { color: var(--text-white); }

		/* TABELA */
		.table-responsive { width: 100%; overflow-x: auto; border-radius: 15px; }
		table { width: 100%; border-collapse: collapse; text-align: left; }

		@media (min-width: 768px) {
			th { background: rgba(255,255,255,0.02); padding: 14px 18px; font-size: 11px; text-transform: uppercase; color: var(--text-gray); letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); }
			td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
			tr:last-child td { border-bottom: none; }
			tr:hover td { background: rgba(255,255,255,0.01); }
		}

		@media (max-width: 767px) {
			table, thead, tbody, th, td, tr { display: block; }
			thead { display: none; }
			tr { background: rgba(255,255,255,0.02); margin-bottom: 15px; border-radius: 15px; padding: 15px; border: 1px solid var(--border-color); }
			td { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border: none; font-size: 14px; }
			td::before { content: attr(data-label); font-weight: 600; color: var(--text-gray); font-size: 11px; text-transform: uppercase; }
			.actions-cell { border-top: 1px solid var(--border-color); margin-top: 10px; padding-top: 15px !important; justify-content: center !important; gap: 10px; }
			.actions-cell::before { display: none; }
		}

		.btn-action {
			padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none;
			display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; border: none; cursor: pointer;
		}
		.btn-edit { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); }
		.btn-deactivate { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); }
		.btn-activate { background: rgba(30, 228, 172, 0.1); color: var(--primary-green); }
		.btn-action:hover { filter: brightness(1.2); }

		.codigo-badge { background: #081418; padding: 3px 10px; border-radius: 6px; font-family: monospace; font-size: 14px; color: var(--primary-green); font-weight: 700; }

		.tipo-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
		.tipo-C { background: rgba(255, 201, 77, 0.1); color: var(--accent-yellow); }
		.tipo-T { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); }
		.tipo-D { background: rgba(30, 228, 172, 0.1); color: var(--primary-green); }
		.tipo-O { background: rgba(142, 161, 167, 0.12); color: var(--text-gray); }

		.status-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
		.status-ativo { background: rgba(30, 228, 172, 0.1); color: var(--primary-green); }
		.status-inativo { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); }

		.obs { color: var(--text-gray); font-size: 13px; }
		.vazio { text-align: center; padding: 40px 10px; color: var(--text-gray); }
		.vazio i { font-size: 32px; display: block; margin-bottom: 10px; }
	</style>
</head>

<body>

<div class="container">
	<header>
		<ul class="breadcrumb">
			<li><a href="/">Home</a> /</li>
			<li style="color: var(--text-gray)">Chaves</li>
		</ul>
		<h1 class="page-title"><span>🔑</span> Controle de Chaves</h1>
	</header>

	<div class="card-custom">

		<div th:if="${sucesso}" class="alert alert-ok"><i class="bi bi-check-circle"></i><span th:text="${sucesso}"></span></div>
		<div th:if="${erro}" class="alert alert-erro"><i class="bi bi-exclamation-triangle"></i><span th:text="${erro}"></span></div>

		<div class="top-actions">
			<div class="btn-group-nav">
				<a href="/chaves/fornecedores" class="btn-custom btn-blue">
					<i class="bi bi-building"></i> Fornecedores
				</a>
			</div>
			<a href="/chaves/novo" class="btn-custom btn-green">
				<i class="bi bi-plus-circle"></i> Nova Chave
			</a>
		</div>

		<!-- FILTROS -->
		<form method="get" action="/chaves" class="filtros">
			<div class="filtro">
				<label for="numero">Número</label>
				<input type="text" id="numero" name="numero" th:value="${fNumero}" placeholder="Ex: 1234" autofocus>
			</div>
			<div class="filtro">
				<label for="fornecedorId">Fornecedor</label>
				<select id="fornecedorId" name="fornecedorId">
					<option value="">Todos</option>
					<option th:each="f : ${fornecedores}" th:value="${f.id()}" th:text="${f.nome()}"
							th:selected="${fFornecedorId != null and f.id() == fFornecedorId}"></option>
				</select>
			</div>
			<div class="filtro">
				<label for="tipo">Tipo</label>
				<select id="tipo" name="tipo">
					<option value="">Todos</option>
					<option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descricao}"
							th:selected="${t == fTipo}"></option>
				</select>
			</div>
			<div class="filtro">
				<label for="status">Status</label>
				<select id="status" name="status">
					<option value="ativas" th:selected="${fStatus == 'ativas'}">Ativas</option>
					<option value="inativas" th:selected="${fStatus == 'inativas'}">Inativas</option>
					<option value="todas" th:selected="${fStatus == 'todas'}">Todas</option>
				</select>
			</div>
			<div class="filtro-botoes">
				<button type="submit" class="btn-custom btn-green"><i class="bi bi-search"></i> Buscar</button>
				<a href="/chaves" class="btn-custom btn-ghost" title="Limpar filtros"><i class="bi bi-x-lg"></i></a>
			</div>
		</form>

		<div class="resumo" th:unless="${#lists.isEmpty(chaves)}">
			<strong th:text="${#lists.size(chaves)}">0</strong> chave(s) ·
			<strong th:text="${totalCopias}">0</strong> cópia(s) ·
			<strong th:text="${totalCadeados}">0</strong> cadeado(s)
		</div>

		<div class="vazio" th:if="${#lists.isEmpty(chaves)}">
			<i class="bi bi-key"></i>
			Nenhuma chave encontrada com esses filtros.
		</div>

		<div class="table-responsive" th:unless="${#lists.isEmpty(chaves)}">
			<table>
				<thead>
				<tr>
					<th>Código</th>
					<th>Fornecedor</th>
					<th>Tipo</th>
					<th>Cópias</th>
					<th>Cadeados</th>
					<th>Observação</th>
					<th>Status</th>
					<th style="text-align: center;">Ações</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="c : ${chaves}">
					<td data-label="Código"><span class="codigo-badge" th:text="${c.codigo()}"></span></td>
					<td data-label="Fornecedor"><strong th:text="${c.fornecedorNome()}"></strong></td>
					<td data-label="Tipo">
						<span class="tipo-badge" th:classappend="${'tipo-' + c.tipo()}" th:text="${c.tipoDescricao()}"></span>
					</td>
					<td data-label="Cópias" th:text="${c.quantidadeCopias()}"></td>
					<td data-label="Cadeados" th:text="${c.quantidadeCadeados()}"></td>
					<td data-label="Observação" class="obs" th:text="${c.observacao() != null ? c.observacao() : '-'}"></td>
					<td data-label="Status">
						<span th:if="${c.ativo()}" class="status-badge status-ativo">Ativa</span>
						<span th:unless="${c.ativo()}" class="status-badge status-inativo">Inativa</span>
					</td>
					<td data-label="Ações" class="actions-cell" style="text-align: center; white-space: nowrap;">
						<a th:href="@{/chaves/editar/{id}(id=${c.id()})}" class="btn-action btn-edit">
							<i class="bi bi-pencil-square"></i> Editar
						</a>
						<a th:if="${c.ativo()}"
						   th:href="@{/chaves/desativar/{id}(id=${c.id()})}"
						   class="btn-action btn-deactivate"
						   onclick="return confirm('Desativar esta chave?');">
							<i class="bi bi-slash-circle"></i> Desativar
						</a>
						<a th:unless="${c.ativo()}"
						   th:href="@{/chaves/ativar/{id}(id=${c.id()})}"
						   class="btn-action btn-activate">
							<i class="bi bi-check-circle"></i> Ativar
						</a>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

</body>
</html>
