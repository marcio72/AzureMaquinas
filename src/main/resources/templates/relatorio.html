<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Relatório de Clientes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/menu :: layout(~{::section})}">
    <section>
<style>
    /* !important: o fragments/menu carrega o Bootstrap de novo depois do CSS da página */
    /* Botões no padrão neon do sistema: fundo escuro, borda e texto coloridos com brilho */
    .btn-neon { background: rgba(255,255,255,.03) !important; border: 1px solid currentColor !important; border-radius: 10px !important;
                font-weight: 600 !important; transition: .2s; }
    .btn-neon:hover { background: currentColor !important; }
    .btn-neon:hover span { color: #081418 !important; }
    .neon-verde   { color: #1ee4ac !important; box-shadow: 0 0 10px rgba(30,228,172,.25); }
    .neon-ciano   { color: #22d3ee !important; box-shadow: 0 0 10px rgba(34,211,238,.25); }
    .neon-vermelho{ color: #ff4d6d !important; box-shadow: 0 0 10px rgba(255,77,109,.25); }
    .neon-azul    { color: #3d8bff !important; box-shadow: 0 0 10px rgba(61,139,255,.25); }
    .btn-neon:hover { box-shadow: 0 0 16px currentColor; }

    /* Lista de clientes: fonte Courier New menor (só esta tabela) */
    .tabela-clientes, .tabela-clientes th, .tabela-clientes td {
        font-family: 'Courier New', Courier, monospace !important; font-size: 12px !important; line-height: 1.3 !important;
    }
    .tabela-clientes th, .tabela-clientes td { padding: 5px 8px !important; }
</style>

<div class="container-fluid p-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h1 class="text-primary mb-0">Relatório de Clientes Ativos</h1>
        <div class="d-flex flex-wrap gap-2">
            <a href="/relatorio/bairros" class="btn btn-neon neon-verde">
                <span>📍 Pontos por Bairro</span>
            </a>
            <a href="/relatorio/regioes" class="btn btn-neon neon-ciano">
                <span>🗺️ Pontos por Região</span>
            </a>
            <a href="/relatorio/pdf" class="btn btn-neon neon-vermelho" target="_blank">
                <span>📄 PDF Resumido</span>
            </a>
            <a href="/relatorio/pdf/completo" class="btn btn-neon neon-azul" target="_blank">
                <span>📑 PDF Completo com Tabela</span>
            </a>
        </div>
    </div>

    <!-- Card resumo total -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="card-title mb-0">Total de Clientes Ativos</h5>
            <span class="badge bg-success fs-5" th:text="${total}"></span>
        </div>
    </div>

    <!-- Tabela de Clientes -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            Lista de Clientes
        </div>
        <div class="card-body table-responsive">
            <table class="table table-hover table-bordered align-middle text-break tabela-clientes">
                <thead class="table-light">
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Logradouro</th>
                        <th>Telefone</th>
                        <th>Bairro</th>
                        <th>Região</th>
                        <th>Data Cadastro</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.codCliente}"></td>
                        <td th:text="${cliente.nomCliente}"></td>
                        <td th:text="${cliente.logradouro}"></td>
                        <td th:text="${cliente.telefone}"></td>
                        <td th:text="${cliente.bairro}"></td>
                        <td th:text="${T(br.com.locaweb.relatorioclientes.util.ConvertRegiao).exibirNome(cliente.regiao)}"></td>
                        <td th:text="${cliente.dtCadastro}"></td>
                    </tr>
                </tbody>
            </table>
            <!-- Paginação: 10 por página -->
            <div class="pag-claro"><div th:replace="~{fragments/paginacao :: barra}"></div></div>
        </div>
    </div>

</div>
</section>
</div>
</body>
</html>
