<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Peças do Lote - Sistema Pro</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		:root {
		   --bg-body: #081418; --bg-card: #10242a; --primary-green: #1ee4ac;
		   --accent-blue: #3d8bff; --accent-red: #ff4d4d; --text-white: #ffffff;
		   --text-gray: #8ea1a7; --border-color: rgba(255, 255, 255, 0.05);
		}
		* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
		body { background-color: var(--bg-body); color: var(--text-white); padding: 15px; }
		.container { max-width: 900px; margin: 0 auto; }
		.breadcrumb a { color: var(--primary-green); text-decoration: none; font-size: 12px; }
		.page-title { font-size: 22px; font-weight: 700; margin: 15px 0; display: flex; align-items: center; gap: 10px; }
		.card-custom { background: var(--bg-card); border-radius: 20px; padding: 20px; border: 1px solid var(--border-color); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
		.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
		.info-label { font-size: 11px; color: var(--text-gray); text-transform: uppercase; display: block; }
		.info-value { font-size: 14px; font-weight: 600; }
		.table-responsive { border-radius: 15px; overflow: hidden; }
		table { width: 100%; border-collapse: collapse; background: transparent; color: white; }
		th { background: rgba(255,255,255,0.02); padding: 15px; font-size: 11px; color: var(--text-gray); text-transform: uppercase; text-align: left; }
		td { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
		.badge-status { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
		.status-available { background: rgba(30, 228, 172, 0.15); color: var(--primary-green); border: 1px solid rgba(30, 228, 172, 0.3); }
		.status-installed { background: rgba(255, 77, 77, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 77, 77, 0.3); }
		.modal-content { background: var(--bg-card); border: 1px solid var(--border-color); color: white; border-radius: 20px; }
		.modal-header, .modal-footer { border-color: var(--border-color); }
		.btn-close { filter: invert(1); }
		.modal-info-item { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
		
		/* Link da ficha de execução */
			.info-value a {
			  text-decoration: none;
			  transition: text-decoration-color 0.15s ease;
			}
			
			/* Hover: sublinha */
			.info-value a:hover {
			  text-decoration: underline;
			}
	</style>
</head>
<body>

<div class="container">
	<header>
		<nav>
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a href="/">Home</a></li>
				<li class="breadcrumb-item"><a href="/lotes">Lotes</a></li>
				<li class="breadcrumb-item active text-secondary">Peças</li>
			</ol>
		</nav>
		<h1 class="page-title">🔧 Peças do Lote <span th:text="${lote.idLote}"></span></h1>
	</header>
	
	<div class="card-custom">
		<div class="info-grid">
			<div class="info-box"><span class="info-label">Categoria</span><span class="info-value" th:text="${lote.categoria.nome}"></span></div>
			<div class="info-box"><span class="info-label">Descrição</span><span class="info-value" th:text="${lote.descricao}"></span></div>
			<div class="info-box"><span class="info-label">Alias</span><span class="info-value" th:text="${lote.alias}"></span></div>
			<div class="info-box">
				<span class="info-label">Data Entrada</span>
				<span class="info-value" th:text="${lote.dataEntrada != null ? #temporals.format(lote.dataEntrada, 'dd/MM/yyyy') : '-'}"></span>
			</div>
		</div>
	</div>
	
	<div class="card-custom">
		<div class="d-flex justify-content-between mb-4">
			<h5 class="m-0">Itens Cadastrados</h5>
			<a href="/lotes" class="btn btn-sm btn-outline-light">Voltar</a>
		</div>
		
		<div class="table-responsive">
			<table>
				<thead><tr><th>ID</th><th>Código</th><th>Status</th><th>Data Instalação</th></tr></thead>
				<tbody>
				<tr th:each="peca : ${pecas}">
					<td th:text="${peca.idPeca}"></td>
					<td class="fw-bold text-info" th:text="${peca.codigo}"></td>
					<td>
						<span th:if="${peca.dataInstalacao == null}" class="badge-status status-available">Disponível</span>
						<span th:if="${peca.dataInstalacao != null}"
							  class="badge-status status-installed"
							  data-bs-toggle="modal"
							  th:data-bs-target="'#modalPeca'+${peca.idPeca}">
                        Instalada <i class="bi bi-info-circle ms-1"></i>
                   </span>
						
						<div class="modal fade" th:id="'modalPeca'+${peca.idPeca}" tabindex="-1" aria-hidden="true">
							<div class="modal-dialog modal-dialog-centered">
								<div class="modal-content text-start">
									<div class="modal-header">
										<h5 class="modal-title">📍 Local de Instalação</h5>
										<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
									</div>
									<div class="modal-body">
										<div class="modal-info-item">
											<span class="info-label">Código da Peça</span>
											<div class="info-value text-info" th:text="${peca.codigo}"></div>
										</div>
										
										<div class="modal-info-item">
											<span class="info-label">Ponto (Cliente)</span>
											<div class="info-value" th:text="${peca.movimento?.cliente?.nomCliente ?: 'Não informado'}"></div>
										</div>
										
										<div class="modal-info-item">
											<span class="info-label">Máquina</span>
											<div class="info-value" th:text="${peca.movimento?.maquina?.nom_maq ?: 'Não informado'}"></div>
										</div>
										
										<div class="modal-info-item">
											<span class="info-label">Jogo da Máquina</span>
											<div class="info-value" th:text="${peca.movimento?.maquina?.nom_jogo ?: 'N/A'}"></div>
										</div>
										
										<div class="modal-info-item">
											<span class="info-label">Data de Instalação</span>
											<div class="info-value" th:text="${peca.dataInstalacao != null ? #temporals.format(peca.dataInstalacao, 'dd/MM/yyyy') : '-'}"></div>
										</div>
										
										<div class="modal-info-item">
											<span class="info-label">Observação</span>
											
											<!-- Sem observação -->
											<div class="info-value"
												 th:if="${peca.observacao == null or #strings.isEmpty(peca.observacao)}">
												Nenhuma
											</div>
											
											<div class="info-value"
												 th:if="${peca.observacao != null and #strings.contains(peca.observacao, 'Ficha de execução:')}">
												
												<a class="text-info fw-semibold text-decoration-none"
												   th:with="nf=${#strings.trim(#strings.substringAfter(peca.observacao, 'Ficha de execução:'))}"
												   th:href="@{/relatorioExecucoes(nf=${nf})}"
												   target="_blank" rel="noopener">
													<i class="bi bi-box-arrow-up-right"></i>
													<span th:text="${peca.observacao}"></span>
												</a>
											</div>
											
											<!-- Observação normal (não é ficha) -->
											<div class="info-value"
												 th:if="${peca.observacao != null and !#strings.contains(peca.observacao, 'Ficha de execução:')}"
												 th:text="${peca.observacao}">
											</div>
										</div>
									</div>
									<div class="modal-footer"><button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Fechar</button></div>
								</div>
							</div>
						</div>
					</td>
					<td th:text="${peca.dataInstalacao != null ? #temporals.format(peca.dataInstalacao, 'dd/MM/yyyy') : '-'}"></td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
