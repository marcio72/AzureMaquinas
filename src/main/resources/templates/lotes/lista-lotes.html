<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Estoque de Lotes - Sistema Pro</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	
	<style>
		:root {
		   --bg-body: #081418;
		   --bg-card: #10242a;
		   --primary-green: #1ee4ac;
		   --accent-blue: #3d8bff;
		   --text-white: #ffffff;
		   --text-gray: #8ea1a7;
		   --border-color: rgba(255, 255, 255, 0.05);
		}
 
		* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
 
		body {
		   background-color: var(--bg-body);
		   color: var(--text-white);
		   padding: 15px;
		}
 
		.container { max-width: 1100px; margin: 0 auto; }
 
		/* HEADER & BREADCRUMB */
		header { margin-bottom: 25px; }
		.breadcrumb { font-size: 12px; color: var(--text-gray); margin-bottom: 10px; list-style: none; display: flex; gap: 5px; }
		.breadcrumb a { color: var(--primary-green); text-decoration: none; }
		.page-title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
 
		/* BOTÕES DE TOPO */
		.action-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
		.btn-custom {
		   padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
		   text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.2s; border: none; cursor: pointer;
		}
		.btn-blue-soft { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); border: 1px solid rgba(61, 139, 255, 0.2); }
		.btn-green { background: var(--primary-green); color: #081418; }
		.btn-custom:hover { transform: translateY(-2px); opacity: 0.9; }
 
		/* PAINEL DE CONTROLES (BUSCA E FILTRO) */
		.controls-panel {
		   background: var(--bg-card);
		   border-radius: 20px;
		   padding: 20px;
		   border: 1px solid var(--border-color);
		   margin-bottom: 20px;
		   display: flex;
		   flex-wrap: wrap;
		   gap: 15px;
		   align-items: flex-end;
		}
 
		.control-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 250px; }
		.control-group label { font-size: 11px; font-weight: 600; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; }
 
		input, select {
		   background: #081418;
		   border: 1px solid var(--border-color);
		   color: white;
		   padding: 12px 15px;
		   border-radius: 12px;
		   outline: none;
		   font-size: 14px;
		   width: 100%;
		   transition: 0.3s;
		}
		input:focus, select:focus { border-color: var(--primary-green); }
 
		/* CARD E TABELA */
		.card-custom {
		   background: var(--bg-card);
		   border-radius: 24px;
		   padding: 20px;
		   border: 1px solid var(--border-color);
		   box-shadow: 0 10px 30px rgba(0,0,0,0.2);
		}
 
		.table-responsive { width: 100%; overflow-x: auto; border-radius: 15px; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
 
		@media (min-width: 768px) {
		   th { background: rgba(255,255,255,0.02); padding: 15px 20px; font-size: 11px; text-transform: uppercase; color: var(--text-gray); border-bottom: 1px solid var(--border-color); }
		   td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
		   tr:hover td { background: rgba(255,255,255,0.01); }
		}
 
		/* RESPONSIVIDADE MOBILE: LINHA VIRA CARD */
		@media (max-width: 767px) {
		   table, thead, tbody, th, td, tr { display: block; }
		   thead { display: none; }
		   tr { background: rgba(255,255,255,0.02); margin-bottom: 15px; border-radius: 15px; padding: 15px; border: 1px solid var(--border-color); }
		   td { display: flex; justify-content: space-between; padding: 8px 0; border: none; font-size: 14px; }
		   td::before { content: attr(data-label); font-weight: 600; color: var(--text-gray); font-size: 11px; text-transform: uppercase; }
		   .actions-cell { border-top: 1px solid var(--border-color); margin-top: 10px; padding-top: 15px !important; }
		}
 
		/* BADGES E ÍCONES */
		.qty-badge { background: #081418; padding: 4px 10px; border-radius: 8px; font-weight: 700; color: var(--primary-green); border: 1px solid rgba(30, 228, 172, 0.2); }
		.btn-action { background: var(--accent-blue); color: white; padding: 8px 16px; border-radius: 10px; text-decoration: none; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; width: 100%; justify-content: center; }
		@media (min-width: 768px) { .btn-action { width: auto; } }
		.btn-action:hover { filter: brightness(1.1); box-shadow: 0 4px 12px rgba(61, 139, 255, 0.3); }
	
	</style>
</head>

<body>

<div class="container">
	<header>
		<ul class="breadcrumb">
			<li><a href="/">Home</a> /</li>
			<li style="color: var(--text-gray)">Lotes</li>
		</ul>
		<h1 class="page-title"><span>📦</span> Lista de Lotes</h1>
		
		<div class="action-bar">
			<a href="/categorias" class="btn-custom btn-blue-soft">
				<i class="bi bi-journal"></i> Categorias
			</a>
			<a href="/lotes/novo" class="btn-custom btn-green">
				<i class="bi bi-plus-circle"></i> Novo Lote
			</a>
		</div>
	</header>
	
	<div class="controls-panel">
		<div class="control-group">
			<label>🔍 Buscar Fornecedor</label>
			<input type="text" id="vendorSearch" placeholder="Digite o nome do fornecedor..." onkeyup="filterTable()">
		</div>
		<div class="control-group">
			<label>📂 Filtrar Categoria</label>
			<select id="categoryFilter" onchange="filterTable()">
				<option value="all">Todas as Categorias</option>
				<option th:each="cat : ${categorias}" th:value="${cat.nome}" th:text="${cat.nome}"></option>
			</select>
		</div>
	</div>
	
	<div class="card-custom">
		<div class="table-responsive">
			<table id="lotesTable">
				<thead>
				<tr>
					<th>ID</th>
					<th>Categoria</th>
					<th>Fornecedor</th>
					<th>Qtd Comprada</th>
					<th>Qtd Atual</th>
					<th>Data Entrada</th>
					<th style="text-align: center;">Ações</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="lote : ${lotes}" th:data-category="${lote.categoria.nome}">
					<td data-label="ID" th:text="${lote.idLote}" style="font-family: monospace; font-weight: bold;"></td>
					<td data-label="Categoria"><strong th:text="${lote.categoria.nome}"></strong></td>
					<td data-label="Fornecedor" class="vendor-cell" th:text="${lote.fornecedor}"></td>
					<td data-label="Qtd Comprada" th:text="${lote.quantidadeComprada}"></td>
					<td data-label="Qtd Atual">
						<span class="qty-badge" th:text="${lote.quantidadeAtual}"></span>
					</td>
					<td data-label="Data Entrada" th:text="${#temporals.format(lote.dataEntrada, 'dd/MM/yyyy')}"></td>
					<td data-label="Ações" class="actions-cell" style="text-align: center;">
						<a th:href="@{/lotes/{id}/pecas(id=${lote.idLote})}" class="btn-action">
							<i class="bi bi-tools"></i> PEÇAS
						</a>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

<script>
	function filterTable() {
		const searchValue = document.getElementById('vendorSearch').value.toLowerCase();
		const categoryValue = document.getElementById('categoryFilter').value;
		const rows = document.querySelectorAll('#lotesTable tbody tr');

		rows.forEach(row => {
			const vendorName = row.querySelector('.vendor-cell').textContent.toLowerCase();
			const rowCategory = row.getAttribute('data-category');

			const matchesSearch = vendorName.includes(searchValue);
			const matchesCategory = (categoryValue === 'all' || rowCategory === categoryValue);

			if (matchesSearch && matchesCategory) {
				row.style.display = "";
			} else {
				row.style.display = "none";
			}
		});
	}
</script>

</body>
</html>
