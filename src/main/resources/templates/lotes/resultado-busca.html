<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Resultado da Busca - Sistema Pro</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		:root { --bg-body: #081418; --bg-card: #10242a; --primary-green: #1ee4ac; --text-white: #ffffff; --border-color: rgba(255, 255, 255, 0.05); }
		body { background-color: var(--bg-body); color: var(--text-white); font-family: 'Inter', sans-serif; padding: 20px; }
		.result-card { background: var(--bg-card); border-radius: 24px; padding: 30px; border: 1px solid var(--border-color); max-width: 700px; margin: 40px auto; }
		.info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
		.label { color: #8ea1a7; text-transform: uppercase; font-size: 11px; font-weight: 600; }
		.value { font-weight: 600; }
	</style>
</head>
<body>
<div class="container">
	<div class="result-card">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h3 class="m-0">🔍 Detalhes da Peça</h3>
			<a href="/" class="btn btn-outline-light btn-sm">Nova Busca</a>
		</div>
		
		<div class="info-row">
			<span class="label">Código</span>
			<span class="value text-info" th:text="${peca.codigo}"></span>
		</div>
		<div class="info-row">
			<span class="label">Status Atual</span>
			<span class="value"
				  th:style="${peca.status == 'INSTALADA' ? 'color: #ff4d4d' : (peca.status == 'DESCARTADA' ? 'color: #b0b0b0' : 'color: #1ee4ac')}"
				  th:text="${peca.status == 'INSTALADA' ? 'INSTALADA' : (peca.status == 'DESCARTADA' ? 'P.T. (DESCARTADA)' : 'DISPONÍVEL')}"></span>
		</div>
		<div class="info-row">
			<span class="label">Lote de Origem</span>
			<span class="value" th:text="${peca.lote.idLote + ' - ' + peca.lote.alias}"></span>
		</div>
		
		<div th:if="${peca.status == 'INSTALADA'}">
			<div class="info-row">
				<span class="label">Localização (Ponto)</span>
				<span class="value" th:text="${peca.cliente?.nomCliente ?: 'N/A'}"></span>
			</div>
			<div class="info-row">
				<span class="label">Máquina</span>
				<span class="value" th:text="${peca.maquina?.nom_maq ?: 'N/A'}"></span>
			</div>
			<div class="info-row">
				<span class="label">Data da Operação</span>
				<span class="value" th:text="${#temporals.format(peca.dataInstalacao, 'dd/MM/yyyy')}"></span>
			</div>
		</div>
		
		<div class="mt-4">
			<span class="label">Observações</span>
			<p class="mt-2 small text-secondary" th:text="${peca.observacao ?: 'Sem observações registradas.'}"></p>
		</div>
	</div>
</div>
</body>
</html>
