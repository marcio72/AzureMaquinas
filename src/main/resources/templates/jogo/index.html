<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Entrar no Jogo</title>
	
	<style>
		body {
			margin: 0;
			height: 100vh;
			background: linear-gradient(135deg, #1e3c72, #2a5298);
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
		}

		.card {
			background: white;
			padding: 30px 40px;
			border-radius: 10px;
			width: 320px;
			text-align: center;
			box-shadow: 0 10px 25px rgba(0,0,0,.25);
		}

		h1 {
			margin-bottom: 20px;
			color: #333;
		}

		input {
			width: 100%;
			padding: 12px;
			font-size: 16px;
			margin-bottom: 15px;
			border-radius: 6px;
			border: 1px solid #ccc;
			outline: none;
		}

		input:focus {
			border-color: #2a5298;
		}

		button {
			width: 100%;
			padding: 12px;
			font-size: 16px;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			background: #2a5298;
			color: white;
			transition: 0.2s;
		}

		button:hover {
			background: #1e3c72;
		}

		.hint {
			margin-top: 15px;
			font-size: 13px;
			color: #666;
		}
	</style>
</head>

<body>

<div class="card">
	<h1> Entrar no Jogo </h1>
	
	<!DOCTYPE html>
	
	<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>🎰 Jogo de Cartas</title>
		
		<!-- Google Font -->
		
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
		
		<style>
			/* ===== RESET ===== */
			* { box-sizing: border-box; }
			body {
			  margin: 0;
			  min-height: 100vh;
			  font-family: 'Roboto', sans-serif;
			  color: #fff;
			  background:
				linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.7)),
				url('/jogo/img/ui/casino-bg.jpg') center/cover no-repeat fixed;
			  display: flex;
			  align-items: center;
			  justify-content: center;
			}
		
			/* ===== CARD CENTRAL ===== */
			.card {
			  background: rgba(20, 20, 20, 0.85);
			  backdrop-filter: blur(6px);
			  border-radius: 18px;
			  padding: 32px 28px;
			  width: 100%;
			  max-width: 420px;
			  box-shadow: 0 20px 50px rgba(0,0,0,.6);
			  text-align: center;
			  border: 1px solid rgba(255,255,255,.08);
			}
		
			.logo {
			  font-family: 'Playfair Display', serif;
			  font-size: 36px;
			  margin-bottom: 8px;
			  color: #f5d27a;
			  letter-spacing: 1px;
			}
		
			.subtitle {
			  font-size: 14px;
			  opacity: .85;
			  margin-bottom: 28px;
			}
		
			/* ===== FORM ===== */
			form {
			  display: flex;
			  flex-direction: column;
			  gap: 14px;
			}
		
			input[type="text"] {
			  padding: 14px 16px;
			  border-radius: 10px;
			  border: none;
			  font-size: 16px;
			  outline: none;
			  background: #111;
			  color: #fff;
			  border: 1px solid rgba(255,255,255,.15);
			}
		
			input::placeholder {
			  color: rgba(255,255,255,.5);
			}
		
			button {
			  margin-top: 10px;
			  padding: 14px;
			  border-radius: 12px;
			  border: none;
			  cursor: pointer;
			  font-size: 16px;
			  font-weight: 500;
			  color: #222;
			  background: linear-gradient(135deg, #f5d27a, #caa94d);
			  transition: transform .15s ease, box-shadow .15s ease;
			  box-shadow: 0 6px 18px rgba(0,0,0,.4);
			}
		
			button:hover {
			  transform: translateY(-2px);
			  box-shadow: 0 10px 28px rgba(0,0,0,.6);
			}
		
			/* ===== FOOTER ===== */
			.footer {
			  margin-top: 22px;
			  font-size: 12px;
			  opacity: .6;
			}
		
			/* ===== MOBILE ===== */
			@media (max-width: 480px) {
			  .card { padding: 26px 20px; }
			  .logo { font-size: 30px; }
			}
		</style>
	
	</head>
	<body>
	
	<div class="card">
		<div class="logo">♠ Jogo de Cartas ♣</div>
		<div class="subtitle">Entre na mesa e teste sua sorte</div>
		
		```
		<!-- mantém a funcionalidade -->
		<form method="post" action="/jogo/entrar">
			<input type="text" name="nome" placeholder="Digite seu nome" required />
			<button type="submit"> Entrar no Jogo</button>
		</form>
		
		<div class="footer">Estilo cassino • Visual apenas</div>
		```
	</div>
	
	</body>
	</html>
	
	
	<div class="hint">
		Aguarde outros jogadores entrarem
	</div>
</div>

</body>
</html>
