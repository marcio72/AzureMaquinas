<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Sala do Jogo</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		/* =========================
   			RESET / BASE
		========================= */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #3a3a3a, #0f0f0f);
    color: #fff;
}

/* 	=========================
  	 LAYOUT – MOBILE FIRST
	========================= */
.container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 12px;
}

.box {
    background: rgba(0,0,0,0.75);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,.6);
}

/* =========================
   JOGADORES
========================= */
.players li {
    list-style: none;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

/* =========================
   NAIPE DA RODADA
========================= */
.naipe-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.naipe-img {
    width: 56px;            /* 🔥 mobile */
    background: #fff;
    padding: 6px;
    border-radius: 10px;
    box-shadow:
        0 6px 16px rgba(0,0,0,.6),
        inset 0 0 0 2px rgba(255,215,0,.4);
}

.badge {
    background: gold;
    color: #222;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 8px;
    font-weight: bold;
}

/* =========================
   MESA – MOBILE FIRST
========================= */
.mesa-cartas-container {
    position: relative;
    min-height: 170px;
    padding: 14px;
    border-radius: 16px;

    background: radial-gradient(
        circle at top,
        #1f7a3d 0%,
        #145c2e 45%,
        #0f3d1f 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow:
        inset 0 4px 8px rgba(255,255,255,.08),
        inset 0 -6px 12px rgba(0,0,0,.6),
        0 14px 30px rgba(0,0,0,.8);
}

/* cartas empilhadas */
.mesa-carta-img {
    position: absolute;
    width: 52px;            /* 🔥 mobile */
    border-radius: 8px;
    box-shadow: 0 8px 18px rgba(0,0,0,.6);
    transition: transform 0.3s ease;
}

/* =========================
   CARTAS DO JOGADOR
========================= */
.cartas-container {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 12px 8px 20px; /* 🔥 mais espaço em cima e embaixo */
}


.carta-img {
    width: 72px; /* 🔥 antes era 64 */
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.6);
    transition: transform .2s ease, box-shadow .2s ease;
}


.carta-img:hover {
    transform: translateY(-10px) scale(1.08); /* 🔥 sobe menos, cresce mais */
    box-shadow: 0 14px 28px rgba(255,215,0,.7);
    z-index: 10; /* 🔥 garante que fique por cima das outras */
}


/* =========================
   TABLET / DESKTOP
========================= */
@media (min-width: 768px) {

    .container {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 24px;
        padding: 20px;
    }

    .mesa-cartas-container {
        min-height: 220px;
        padding: 24px;
    }

    .mesa-carta-img {
        width: 90px;        /* 🔥 desktop */
    }

    .carta-img {
        width: 90px;
    }

    .naipe-img {
        width: 80px;
    }
}

/* =========================
   DESKTOP GRANDE
========================= */
@media (min-width: 1200px) {
    .mesa-cartas-container {
        min-height: 280px;
    }

    .mesa-carta-img {
        width: 110px;
    }
}
		
		/* ===== ANIMAÇÃO CARTA PARA MESA ===== */
			.carta-voando {
    		position: fixed;
    		z-index: 9999;
    		pointer-events: none;

    		transition:
        		transform 0.6s cubic-bezier(.25,.8,.25,1),
        		opacity 0.4s ease;

    			box-shadow: 0 14px 30px rgba(0,0,0,.8);
}
	
	</style>

</head>
<body>
	<audio id="som-carta">
		<source src="/jogo/sounds/card-drop.mp3" type="audio/mpeg">
	</audio>

<h2 class="titulo"> Sala do Jogo</h2>

<div class="container">
	<!-- 🎲 COLUNA ESQUERDA -->
	<div class="box box-left">
		<h3>🧍 Jogadores</h3>
		
		<ul class="players">
			<li th:each="j : ${jogadores}">
				<span class="player-name" th:text="${j.nome}"></span>
			</li>
		</ul>
		
		<hr>
		
		<h3>🃏 Naipe da Rodada</h3>
		<div class="naipe-container">
			<span class="badge" id="naipe-text">—</span>
			<img id="naipe-img" class="naipe-img" style="display:none;">
		</div>
	</div>
	
	<!-- 🪑 COLUNA DIREITA -->
	<div class="box box-right">
		<h3>🪑 Mesa</h3>
		
		<div class="mesa-cartas-container" id="mesa">
			<!-- cartas da mesa entram via JS -->
		</div>
		
		<hr>
		
		<h3>🖐️ Suas Cartas</h3>
		
		<div class="cartas-container">
			<img th:each="c, i : ${jogador.cartas}"
				 class="carta-img"
				 th:src="@{'/jogo/img/cartas/' + ${c.naipe.name().toLowerCase()} + '/' + ${c.valor.toLowerCase()} + '_' + ${c.naipe.name().toLowerCase()} + '.png'}"
				 th:onclick="|jogarComAnimacao(this, ${i.index})|">
		</div>
	</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script>
	const socket = new SockJS('/ws');
	const stomp = Stomp.over(socket);

	stomp.connect({}, () => {

		stomp.subscribe('/topic/estado', msg => {
			const data = JSON.parse(msg.body);

			/* jogadores */
			const ul = document.querySelector('.players');
			ul.innerHTML = '';
			data.jogadores.forEach(nome => {
				const li = document.createElement('li');
				li.innerText = nome;
				ul.appendChild(li);
			});

			/* naipe da rodada (TEXTO + IMAGEM) */
			const naipeText = document.getElementById("naipe-text");
			const naipeImg = document.getElementById("naipe-img");

			if (data.naipe) {
				naipeText.innerText = data.naipe;
				naipeImg.src = `/jogo/img/cartas/${data.naipe}/a_${data.naipe}.png`;
				naipeImg.style.display = "inline-block";
			} else {
				naipeText.innerText = "—";
				naipeImg.style.display = "none";
			}

			/* mesa */
			const mesa = document.getElementById("mesa");
			mesa.innerHTML = "";

			data.mesa.forEach(jogada => {
				const carta = jogada.carta;

				const img = document.createElement("img");
				img.className = "mesa-carta-img";
				img.src = `/jogo/img/cartas/${carta.naipe}/${carta.valor}_${carta.naipe}.png`;
				img.title = `Jogador: ${jogada.jogador}`;

				data.mesa.forEach((jogada, index) => {
    const carta = jogada.carta;

    const img = document.createElement("img");
    img.className = "mesa-carta-img";
    img.src = `/jogo/img/cartas/${carta.naipe}/${carta.valor}_${carta.naipe}.png`;
    img.title = `Jogador: ${jogada.jogador}`;

    // 🔥 deslocamento da pilha
    const offset = index * 18;
    img.style.transform = `translate(${offset}px, ${offset}px)`;
    img.style.zIndex = index;

    mesa.appendChild(img);
});

			});
		});

	});

	function jogar(index) {

    const cartas = document.querySelectorAll(".carta-img");
    const carta = cartas[index];
    if (!carta) return;

    const mesa = document.getElementById("mesa");
    const som = document.getElementById("som-carta");

    // posição inicial da carta
    const origem = carta.getBoundingClientRect();
    const destino = mesa.getBoundingClientRect();

    // clona a carta
    const clone = carta.cloneNode(true);
    clone.classList.add("carta-animada");

    clone.style.top = origem.top + "px";
    clone.style.left = origem.left + "px";
    clone.style.width = origem.width + "px";

    document.body.appendChild(clone);

    // força repaint
    clone.getBoundingClientRect();

    // posição final (centro da mesa)
    clone.style.top =
        destino.top + destino.height / 2 - origem.height / 2 + "px";
    clone.style.left =
        destino.left + destino.width / 2 - origem.width / 2 + "px";
    clone.style.transform = "scale(1.1) rotate(5deg)";

    // depois da animação
    setTimeout(() => {
        clone.remove();
        som.currentTime = 0;
        som.play();
        
        // 👉 aqui continua seu fluxo normal (websocket / backend)
        stomp.send('/app/jogar', {}, JSON.stringify({
            cartaIndex: index
        }));

    }, 650);
}
	
	function tocarSomCarta() {
    const som = document.getElementById("som-carta");
    som.currentTime = 0;
    som.play();
}
	
	function animarCartaParaMesa(imgCarta) {

    const mesa = document.getElementById("mesa");
    const mesaRect = mesa.getBoundingClientRect();
    const cartaRect = imgCarta.getBoundingClientRect();

    // clone visual
    const clone = imgCarta.cloneNode(true);
    clone.classList.add("carta-voando");

    clone.style.left = cartaRect.left + "px";
    clone.style.top = cartaRect.top + "px";
    clone.style.width = cartaRect.width + "px";

    document.body.appendChild(clone);

    // posição alvo = centro da mesa
    const destinoX =
        mesaRect.left + mesaRect.width / 2 - cartaRect.width / 2;
    const destinoY =
        mesaRect.top + mesaRect.height / 2 - cartaRect.height / 2;

    requestAnimationFrame(() => {
        clone.style.transform =
            `translate(${destinoX - cartaRect.left}px,
                       ${destinoY - cartaRect.top}px)
             scale(1.1) rotate(2deg)`;
        clone.style.opacity = "0.8";
    });

    // remove o clone
    setTimeout(() => {
        clone.remove();
    }, 700);
}

	function jogarComAnimacao(img, index) {

    animarCartaParaMesa(img);

    // som
    const som = document.getElementById("som-carta");
    if (som) {
        som.currentTime = 0;
        som.play();
    }

    // pequeno delay para ficar natural
    setTimeout(() => {
        jogar(index);
    }, 200);
}




</script>


</body>
</html>
