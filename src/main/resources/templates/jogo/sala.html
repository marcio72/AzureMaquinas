<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Sala do Jogo - Premium</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
	
	<style>
		:root {
			/* CORES - MESA VERDE ROYAL */
			--bg-dark: #121212;
			--bg-panel: rgba(20, 20, 20, 0.95);
			--accent: #dcb95a;
			--wood-border: #3e2723;
			--table-gradient: radial-gradient(circle at center, #2e5c38 0%, #1a3c22 40%, #0a180d 100%);
		 }
   
		* { box-sizing: border-box; }
  
		body {
		   margin: 0;
		   padding: 0;
		   font-family: 'Roboto', sans-serif;
		   background: var(--bg-dark);
		   color: #fff;
		   height: 100vh;
		   overflow: hidden;
		   display: flex;
		   flex-direction: column;
		}
  
		/* --- TOPO --- */
		.top-bar {
		   background: var(--bg-panel);
		   padding: 5px 15px;
		   display: flex;
		   justify-content: space-between;
		   align-items: center;
		   border-bottom: 1px solid rgba(220, 185, 90, 0.3);
		   height: 60px;
		   flex-shrink: 0;
		   z-index: 100;
		   box-shadow: 0 5px 15px rgba(0,0,0,0.5);
		}
  
		.room-info {
		   font-family: 'Playfair Display', serif;
		   font-size: 1.1rem;
		   color: var(--accent);
		   margin-right: 15px;
		   text-transform: uppercase;
		   letter-spacing: 1px;
		}
		
		.players-scroll {
		   display: flex;
		   gap: 10px;
		   overflow-x: auto;
		   align-items: center;
		   flex-grow: 1;
		   scrollbar-width: none;
		   padding-right: 10px;
		}
		.players-scroll::-webkit-scrollbar { display: none; }
		
		.player-chip {
		   background: #1a1a1a;
		   padding: 6px 12px;
		   border-radius: 50px;
		   font-size: 0.85rem;
		   border: 1px solid #333;
		   display: flex;
		   align-items: center;
		   gap: 8px;
		   white-space: nowrap;
		   color: #aaa;
		   transition: all 0.3s ease;
		   box-shadow: 0 2px 5px rgba(0,0,0,0.3);
		}
		
		.player-chip.vez-atual {
		   background: linear-gradient(135deg, #dcb95a, #b89535);
		   color: #111;
		   font-weight: bold;
		   border-color: #ffe082;
		   box-shadow: 0 0 10px rgba(220, 185, 90, 0.6);
		   transform: scale(1.05);
		}
  
		.naipe-info {
		   display: flex;
		   align-items: center;
		   gap: 5px;
		   margin-left: 10px;
		   background: rgba(0,0,0,0.4);
		   padding: 4px 8px;
		   border-radius: 6px;
		   border: 1px solid rgba(255,255,255,0.1);
		}
		.naipe-mini { width: 22px; height: auto; background: white; border-radius: 3px; }
  
		/* --- MESA --- */
		.game-area {
		   flex-grow: 1;
		   position: relative;
		   display: flex;
		   justify-content: center;
		   align-items: center;
		   background: var(--table-gradient);
		   margin: 10px;
		   border-radius: 30px;
		   border: 12px solid var(--wood-border);
		   box-shadow: inset 0 0 80px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.5);
		   overflow: hidden;
		}
  
		.mesa-centro {
		   position: relative;
		   width: 100%;
		   height: 100%;
		   display: flex;
		   justify-content: center;
		   align-items: center;
		}
  
		.mesa-carta {
		   position: absolute;
		   width: 120px;
		   height: 169px;
		   top: 50%;
		   left: 50%;
		   transform-origin: center center;
		   transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		   box-shadow: 0 10px 20px rgba(0,0,0,0.6);
		   border-radius: 6px;
		   object-fit: contain;
		}
		
		/* --- ÁREA DA MÃO (Onde estava o problema) --- */
		.my-hand-area {
		   height: 180px; /* Altura padrão Desktop */
		   background: linear-gradient(to top, #000 30%, transparent);
		   display: flex;
		   flex-direction: column;
		   justify-content: flex-end; /* Alinha no fundo */
		   align-items: center;
		   padding-bottom: 20px;
		   z-index: 200;
		   flex-shrink: 0;
		   pointer-events: none;
		}
		
		.my-hand-area > * { pointer-events: auto; }
  
		/* MOBILE FIX - Aumentar altura e padding para não cortar */
		@media (max-width: 480px) {
		   .mesa-carta { width: 90px !important; height: 127px !important; }
		   
		   /* AQUI ESTÁ A CORREÇÃO DO CORTE */
		   .my-hand-area {
			   height: 230px !important; /* Muito mais altura para caber a carta */
			   padding-bottom: 50px !important; /* Empurra as cartas pra cima fugindo da borda do celular */
		   }
		   
		   .carta-img {
			   width: 100px !important;
			   height: 141px !important;
		   }
		   
		   .room-info { font-size: 0.9rem; }
		}
		
		.status-text {
		   margin-bottom: 10px;
		   font-size: 0.9rem;
		   background: rgba(0,0,0,0.8);
		   padding: 5px 15px;
		   border-radius: 20px;
		   border: 1px solid #333;
		   color: #ddd;
		   box-shadow: 0 4px 10px rgba(0,0,0,0.5);
		   font-weight: 500;
		}
  
		.cartas-container {
		   display: flex;
		   justify-content: center;
		   align-items: flex-end; /* Garante que a base das cartas fique alinhada */
		   padding: 0 10px;
		   max-width: 100%;
		   height: 150px; /* Altura fixa para o container das cartas */
		}
  
		.carta-img {
		   width: 100px;
		   height: 141px;
		   border-radius: 8px;
		   box-shadow: -5px 5px 15px rgba(0,0,0,0.7);
		   cursor: pointer;
		   transition: transform 0.2s, margin 0.2s, filter 0.2s;
		   margin-left: -45px;
		   background: white;
		   border: 1px solid #aaa;
		   
		   /* Garante que a imagem não seja esticada estranhamente */
		   flex-shrink: 0;
		}
		.carta-img:first-child { margin-left: 0; }
		
		.carta-img:hover {
		   transform: translateY(-40px) scale(1.15) rotate(2deg);
		   z-index: 1000;
		   margin-right: 30px;
		   box-shadow: 0 20px 30px rgba(0,0,0,0.8);
		   border-color: var(--accent);
		}
		
		.bloqueado {
		   opacity: 0.5;
		   pointer-events: none;
		   filter: grayscale(90%) brightness(0.7);
		}
  
		/* BOTÃO INICIAR */
		.btn-iniciar-flutuante {
		   position: absolute;
		   z-index: 300;
		   padding: 15px 40px;
		   font-size: 1.1rem;
		   background: linear-gradient(135deg, #dcb95a, #b89535);
		   color: #111;
		   border: none;
		   border-radius: 50px;
		   box-shadow: 0 10px 30px rgba(0,0,0,0.7);
		   cursor: pointer;
		   font-weight: bold;
		   text-transform: uppercase;
		   letter-spacing: 1px;
		   animation: pulsar 2s infinite;
		}
		
		@keyframes pulsar {
		   0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 185, 90, 0.7); }
		   70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(220, 185, 90, 0); }
		   100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 185, 90, 0); }
		}
		
		.carta-voando {
		   position: fixed !important;
		   width: 120px !important;
		   height: 169px !important;
		   z-index: 9999;
		   pointer-events: none;
		   transition: all 0.6s ease-in-out;
		   box-shadow: 0 15px 30px rgba(0,0,0,0.5);
		}
		
		/* TELA DE VITÓRIA */
		.vitoria-overlay {
		   position: fixed;
		   top: 0;
		   left: 0;
		   width: 100%;
		   height: 100%;
		   background: rgba(0,0,0,0.92);
		   backdrop-filter: blur(5px);
		   z-index: 9000;
		   display: flex;
		   flex-direction: column;
		   justify-content: center;
		   align-items: center;
		   color: white;
		   animation: fadeIn 0.5s ease;
		}
		
		.btn-sair-topo {
		   background: transparent;
		   color: #ef5350;
		   border: 1px solid #ef5350;
		   padding: 6px 12px;
		   border-radius: 6px;
		   cursor: pointer;
		   font-size: 0.9rem;
		   margin-left: 10px;
		   transition: 0.2s;
		}
		.btn-sair-topo:hover { background: #ef5350; color: white; }
  
		.trofeu-animado {
		   font-size: 5rem;
		   color: var(--accent);
		   animation: bounce 2s infinite;
		   margin-bottom: 20px;
		   text-shadow: 0 0 30px rgba(220, 185, 90, 0.4);
		}
		
		.vencedor-nome {
		   font-family: 'Playfair Display', serif;
		   font-size: 2.5rem;
		   font-weight: bold;
		   color: #fff;
		   margin-bottom: 20px;
		}
		
		.podio-lista {
		   background: #1a1a1a;
		   padding: 20px;
		   border-radius: 15px;
		   width: 85%;
		   max-width: 350px;
		   border: 1px solid #333;
		   box-shadow: 0 10px 30px rgba(0,0,0,0.5);
		}
		
		.podio-item {
		   display: flex;
		   justify-content: space-between;
		   padding: 10px;
		   border-bottom: 1px solid #333;
		   font-size: 1.1rem;
		}
		.podio-item:last-child { border-bottom: none; }
		.podio-item:first-child { color: var(--accent); font-weight: bold; font-size: 1.2rem; }
		
		.btn-sair-final {
		   margin-top: 30px;
		   background: #d32f2f;
		   color: white;
		   border: none;
		   padding: 15px 40px;
		   font-size: 1.1rem;
		   border-radius: 50px;
		   cursor: pointer;
		   box-shadow: 0 5px 15px rgba(0,0,0,0.4);
		}
  
		@keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-20px);} 60% {transform: translateY(-10px);} }
		@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
		
		/* --- ESTILO NOVO: CHAT / MENSAGEIRO --- */
       .chat-btn-float {
           position: fixed; bottom: 20px; right: 20px;
           width: 60px; height: 60px;
           background: var(--accent); color: #111;
           border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
           display: flex; justify-content: center; align-items: center;
           font-size: 1.5rem; cursor: pointer; z-index: 500;
           transition: transform 0.2s;
       }
       .chat-btn-float:active { transform: scale(0.9); }
       
       .chat-window {
           position: fixed; bottom: 90px; right: 20px;
           width: 320px; height: 400px;
           background: #1a1a1a; border: 1px solid #444;
           border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
           z-index: 500; display: flex; flex-direction: column;
           overflow: hidden; opacity: 0; pointer-events: none; transform: translateY(20px);
           transition: all 0.3s ease;
       }
       .chat-window.ativo { opacity: 1; pointer-events: auto; transform: translateY(0); }
       
       /* Mobile Chat */
       @media (max-width: 480px) {
           .chat-window {
               width: 90%; right: 5%; bottom: 90px; height: 50vh;
           }
       }

       .chat-header {
           background: #222; padding: 10px 15px; border-bottom: 1px solid #333;
           display: flex; justify-content: space-between; align-items: center;
           font-weight: bold; color: var(--accent);
       }
       .chat-body {
           flex-grow: 1; padding: 10px; overflow-y: auto; background: #121212;
           display: flex; flex-direction: column; gap: 8px;
       }
       .chat-footer {
           padding: 10px; background: #222; border-top: 1px solid #333;
           display: flex; gap: 5px;
       }
       .chat-input {
           flex-grow: 1; background: #333; border: 1px solid #444; color: white;
           padding: 8px; border-radius: 20px; outline: none;
       }
       .chat-send-btn {
           background: var(--accent); color: #111; border: none;
           width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
           display: flex; justify-content: center; align-items: center;
       }

       /* Balões de Mensagem */
       .msg { max-width: 80%; padding: 8px 12px; border-radius: 15px; font-size: 0.9rem; line-height: 1.3; }
       .msg.eu { align-self: flex-end; background: #2e5c38; color: white; border-bottom-right-radius: 2px; }
       .msg.outro { align-self: flex-start; background: #333; color: #ddd; border-bottom-left-radius: 2px; }
       .msg-nome { font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-bottom: 2px; display: block; }
		
		/* Bolinha de notificação no botão */
			.notification-badge {
				position: absolute;
				top: -5px;
				right: -5px;
				width: 15px;
				height: 15px;
				background-color: #ff4444;
				border-radius: 50%;
				border: 2px solid #1a1a1a;
				display: none; /* Começa escondido */
				animation: bounce 0.5s;
			}

/* Animaçãozinha pro botão pular */
	@keyframes bounce {
			0%, 100% { transform: scale(1); }
			50% { transform: scale(1.2); }
		}
	</style>
</head>

<body>

<div id="tela-vitoria" class="vitoria-overlay" style="display: none;">
	<i class="fas fa-trophy trofeu-animado"></i>
	<div style="font-size: 1rem; opacity: 0.7; letter-spacing: 2px;">VENCEDOR DA PARTIDA</div>
	<div id="vencedor-nome" class="vencedor-nome">NOME</div>
	<div class="podio-lista" id="lista-podio"></div>
	<button class="btn-sair-final" onclick="sairDoJogo()">
		<i class="fas fa-home"></i> Voltar ao Menu
	</button>
</div>
<div class="chat-btn-float" id="botaoChat" onclick="abrirChatELimpar()" style="display: none;">
	<i class="fas fa-comment-alt"></i>
	<span id="notificacaoMsg" class="notification-badge"></span>
</div>

<audio id="audio-chat" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<div class="chat-window" id="janelaChat">
	<div class="chat-header">
		<span><i class="fas fa-comments"></i> Mensageiro</span>
		<i class="fas fa-times" style="cursor:pointer; color:#888;" onclick="toggleChat()"></i>
	</div>
	<div class="chat-body" id="chatBody">
		<div style="text-align: center; color: #555; font-size: 0.8rem; margin-top: 10px;">
			Bem-vindo ao chat da sala!
		</div>
	</div>
	<div class="chat-footer">
		<select id="chatDestino" class="chat-select" style="max-width: 80px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; margin-right: 5px;">
			<option value="TODOS">Todos</option>
		</select>
		
		<input type="text" class="chat-input" id="chatInput" placeholder="Digite..." onkeypress="handleEnter(event)">
		<button class="chat-send-btn" onclick="enviarMensagem()">
			<i class="fas fa-paper-plane"></i>
		</button>
	</div>
</div>
<div class="top-bar">
	<div class="room-info">
		<i class="fas fa-crown"></i> Mesa <span th:text="${partidaId.substring(0,4)}"></span>
	</div>
	
	<div class="players-scroll" id="lista-jogadores">
		<div class="player-chip">Aguardando...</div>
	</div>
	
	<div class="naipe-info" id="box-naipe" style="display:none;">
		<img id="naipe-img" class="naipe-mini" src="">
	</div>
	
	<button class="btn-sair-topo" onclick="sairDoJogo()">
		<i class="fas fa-sign-out-alt"></i>
	</button>
</div>

<div class="game-area">
	<button id="btn-iniciar" onclick="iniciarPartida()" class="btn-iniciar-flutuante" style="display:none;">
		INICIAR PARTIDA
	</button>
	
	<div class="mesa-centro" id="mesa"></div>
</div>

<div class="my-hand-area">
	<div class="status-text">
		<span th:text="${jogador.nome}">Você</span>
	</div>
	<div class="cartas-container" id="minhas-cartas">
		<th:block th:if="${jogador.cartas != null}">
			<img th:each="c : ${jogador.cartas}"
				 class="carta-img"
				 th:src="@{'/jogo/img/cartas/' + ${c.naipe.name().toLowerCase()} + '/' + ${c.valor.toLowerCase()} + '_' + ${c.naipe.name().toLowerCase()} + '.png'}"
				 th:attr="data-naipe=${c.naipe}, data-valor=${c.valor}"
				 onclick="jogarComAnimacao(this)">
		</th:block>
	</div>
</div>

<audio id="som-carta">
	<source src="/jogo/sounds/card-drop.mp3" type="audio/mpeg">
</audio>

<script th:inline="javascript">
	const PARTIDA_ID = [[${partidaId}]];
	const NOME_JOGADOR = [[${jogador.nome}]];
</script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
	const socket = new SockJS('/ws-jogo');
	const stomp = Stomp.over(socket);
	stomp.debug = null;

	stomp.connect({}, () => {
       console.log("✅ Conectado!");
       
       // 1. Canal do JOGO (Mesa e Cartas)
       stomp.subscribe(`/topic/partida/${PARTIDA_ID}`, msg => {
           const data = JSON.parse(msg.body);
           atualizarTela(data);
       });

       // 2. Canal de CHAT PÚBLICO (Geral)
       stomp.subscribe(`/topic/chat/${PARTIDA_ID}`, msg => {
           const chatData = JSON.parse(msg.body);
           receberMensagem(chatData);
       });

       // 3. Canal de CHAT PRIVADO (NOVO - Só eu escuto)
       stomp.subscribe(`/topic/chat/${PARTIDA_ID}/privado/${NOME_JOGADOR}`, msg => {
           const chatData = JSON.parse(msg.body);
           receberMensagem(chatData);
       });

       verificarStatusInicial();
    });

	function verificarStatusInicial() {
	   const cartasMao = document.getElementById("minhas-cartas").children.length;
	   if (cartasMao === 0) {
		document.getElementById("btn-iniciar").style.display = "block";
	   }
	}

	function iniciarPartida() {
	   fetch(`/api/partidas/${PARTIDA_ID}/iniciar`, { method: 'POST' })
	   .then(res => {
		if(res.ok) document.getElementById("btn-iniciar").style.display = "none";
	   });
	}

	function atualizarTela(data) {
	
	// --- CONTROLE DE VISIBILIDADE DO CHAT ---
       const btnChat = document.getElementById('botaoChat');
       const janelaChat = document.getElementById('janelaChat');

       // Se o jogo está ROLANDO ou ACABOU, libera o chat
       if (data.status === 'EM_ANDAMENTO' || data.status === 'FINALIZADA') {
           btnChat.style.display = 'flex'; // Mostra o botão
       }
       // Se ainda está AGUARDANDO, esconde tudo
       else {
           btnChat.style.display = 'none'; // Esconde o botão
           janelaChat.classList.remove('ativo'); // Fecha a janela se estiver aberta
       }
       
	   if (data.status === 'FINALIZADA') {
		 mostrarVitoria(data.jogadores);
		 return;
	   }

	   const jogadorDaVez = data.jogadorDaVez;
	   const eMinhaVez = (jogadorDaVez === NOME_JOGADOR);

	   const divJogadores = document.getElementById("lista-jogadores");
	   if (data.jogadores) {
		 divJogadores.innerHTML = "";
		 data.jogadores.forEach(j => {
		   const div = document.createElement("div");
		   const isVezDesse = (j.nome === jogadorDaVez);
		   div.className = `player-chip ${isVezDesse ? 'vez-atual' : ''}`;
		   const icon = isVezDesse ? '<i class="fas fa-dharmachakra fa-spin"></i>' : '<i class="fas fa-user"></i>';
		   div.innerHTML = `${icon} ${j.nome} &nbsp;<b style="color: ${isVezDesse ? '#000' : '#dcb95a'}">${j.pontos}</b>`;
		   divJogadores.appendChild(div);
		 });
	   }
	   
	   if (data.status === 'EM_ANDAMENTO') {
		 document.getElementById("btn-iniciar").style.display = "none";
	   }

	   const boxNaipe = document.getElementById("box-naipe");
	   const naipeImg = document.getElementById("naipe-img");
	   if (data.naipeDaRodada) {
		 let n = data.naipeDaRodada.toLowerCase();
		 if (n !== 'paus' && n.endsWith('s')) n = n.slice(0, -1);
		 naipeImg.src = `/jogo/img/cartas/${n}/a_${n}.png`;
		 boxNaipe.style.display = "flex";
	   } else {
		 boxNaipe.style.display = "none";
	   }

	   const mesa = document.getElementById("mesa");
	   mesa.innerHTML = "";
	   if (data.mesa && data.mesa.length > 0) {
		 const totalCartas = data.mesa.length;
		 const isMobile = window.innerWidth < 500;
		 const spreadFactor = isMobile ? 15 : 30;
		 
		 data.mesa.forEach((jogada, index) => {
		   const img = document.createElement("img");
		   img.className = "mesa-carta";
		   let n = String(jogada.naipe).toLowerCase();
		   let v = String(jogada.valor).toLowerCase();
		   img.src = `/jogo/img/cartas/${n}/${v}_${n}.png`;
		   const meio = (totalCartas - 1) / 2;
		   const distanciaDoMeio = index - meio;
		   const offsetX = distanciaDoMeio * spreadFactor;
		   const rot = distanciaDoMeio * (isMobile ? 5 : 8);
		   const z = 10 + index;
		   img.style.transform = `translate(-50%, -50%) translateX(${offsetX}px) rotate(${rot}deg)`;
		   img.style.zIndex = z;
		   mesa.appendChild(img);
		 });
	   }

	   const minhasCartasDiv = document.getElementById("minhas-cartas");
	   const statusArea = document.querySelector(".status-text");
	   
	   if (eMinhaVez) {
		 statusArea.innerHTML = `<i class="fas fa-exclamation-circle" style="color: #dcb95a"></i> SUA VEZ DE JOGAR!`;
		 statusArea.style.border = "1px solid #dcb95a";
		 statusArea.style.color = "#dcb95a";
		 minhasCartasDiv.classList.remove("bloqueado");
	   } else {
		 statusArea.innerHTML = `Aguardando ${jogadorDaVez}...`;
		 statusArea.style.border = "1px solid #333";
		 statusArea.style.color = "#888";
		 minhasCartasDiv.classList.add("bloqueado");
	   }

	   const eu = data.jogadores.find(j => j.nome === NOME_JOGADOR);
	   if (eu && eu.cartas) {
		 minhasCartasDiv.innerHTML = "";
		 eu.cartas.forEach(c => {
		   const img = document.createElement("img");
		   img.className = "carta-img";
		   let n = String(c.naipe).toLowerCase();
		   let v = String(c.valor).toLowerCase();
		   img.src = `/jogo/img/cartas/${n}/${v}_${n}.png`;
		   img.dataset.naipe = c.naipe;
		   img.dataset.valor = c.valor;
		   img.onclick = () => jogarComAnimacao(img);
		   minhasCartasDiv.appendChild(img);
		 });
	   }
	   
	   const select = document.getElementById('chatDestino');
       if (select) { // Proteção para não dar erro se o html não carregar
           const valorAtual = select.value;
           
           // Limpa tudo e recria a opção TODOS
           select.innerHTML = '<option value="TODOS">Todos</option>';
           
           if (data.jogadores) {
               data.jogadores.forEach(j => {
                   // Adiciona todos MENOS eu mesmo
                   if (j.nome !== NOME_JOGADOR) {
                       const opt = document.createElement('option');
                       opt.value = j.nome;
                       opt.innerText = j.nome;
                       select.appendChild(opt);
                   }
               });
           }
           
           // Se eu tinha selecionado alguém que ainda está na sala, mantém selecionado
           if ([...select.options].some(o => o.value === valorAtual)) {
               select.value = valorAtual;
           }
       }
	}

	function jogar(img) {
	   stomp.send(`/app/partida/${PARTIDA_ID}/jogar`, {}, JSON.stringify({
		 nomeJogador: NOME_JOGADOR,
		 carta: { naipe: img.dataset.naipe, valor: img.dataset.valor }
	   }));
	}

	function jogarComAnimacao(imgOriginal) {
	   const audio = document.getElementById("som-carta");
	   if(audio) { audio.currentTime = 0; audio.play().catch(()=>{}); }
	   animarVoo(imgOriginal);
	   jogar(imgOriginal);
	}

	function animarVoo(elementoOriginal) {
	   const rectOrigem = elementoOriginal.getBoundingClientRect();
	   const rectMesa = document.getElementById("mesa").getBoundingClientRect();
	   
	   const clone = elementoOriginal.cloneNode(true);
	   clone.style.width = elementoOriginal.offsetWidth + "px";
	   clone.style.height = elementoOriginal.offsetHeight + "px";
	   clone.style.position = "fixed";
	   clone.style.left = rectOrigem.left + "px";
	   clone.style.top = rectOrigem.top + "px";
	   clone.classList.add("carta-voando");
	   document.body.appendChild(clone);

	   elementoOriginal.style.opacity = "0";

	   requestAnimationFrame(() => {
		 const destinoX = rectMesa.left + (rectMesa.width / 2) - (rectOrigem.width / 2);
		 const destinoY = rectMesa.top + (rectMesa.height / 2) - (rectOrigem.height / 2);
		 clone.style.left = destinoX + "px";
		 clone.style.top = destinoY + "px";
		 clone.style.transform = "rotate(180deg) scale(0.9)";
	   });
	   setTimeout(() => clone.remove(), 700);
	}
	
	function sairDoJogo() {
	   fetch(`/api/partidas/${PARTIDA_ID}/sair?nome=${NOME_JOGADOR}`, { method: 'POST' })
	   .then(() => window.location.href = "/jogo")
	   .catch(() => window.location.href = "/jogo");
	}

	function mostrarVitoria(jogadores) {
	   const overlay = document.getElementById("tela-vitoria");
	   const divVencedor = document.getElementById("vencedor-nome");
	   const listaPodio = document.getElementById("lista-podio");
	   
	   const ranking = jogadores.sort((a, b) => b.pontos - a.pontos);
	   const campeao = ranking[0];

	   divVencedor.innerText = campeao.nome;
	   listaPodio.innerHTML = "";
	   
	   ranking.forEach((j, index) => {
		  const item = document.createElement("div");
		  item.className = "podio-item";
		  let icone = index === 0 ? "👑" : `#${index + 1}`;
		  let cor = index === 0 ? "var(--accent)" : "#fff";
		  item.innerHTML = `<span style="color:${cor}">${icone} ${j.nome}</span> <span>${j.pontos} pts</span>`;
		  listaPodio.appendChild(item);
	   });

	   overlay.style.display = "flex";
	   iniciarShowDaVitoria();
	}
	
	function iniciarShowDaVitoria() {
	   chuvaDeEmojisLenta();
	   dispararConfetes();
	}
	
	function dispararConfetes() {
	   const end = Date.now() + (3 * 1000);
	   const zIndexConfete = 9999;
	   const colors = ['#dcb95a', '#ffffff', '#ff0000'];

	   (function frame() {
		  confetti({
			 particleCount: 5,
			 angle: 60,
			 spread: 55,
			 origin: { x: 0 },
			 zIndex: zIndexConfete,
			 colors: colors
		  });
		  confetti({
			 particleCount: 5,
			 angle: 120,
			 spread: 55,
			 origin: { x: 1 },
			 zIndex: zIndexConfete,
			 colors: colors
		  });

		  if (Date.now() < end) {
			 requestAnimationFrame(frame);
		  }
	   }());
	}

	function chuvaDeEmojisLenta() {
	   const container = document.body;
	   const emojis = ["🏆", "🃏", "✨", "💰", "👑"];
	   
	   for(let i=0; i<30; i++) {
		  const el = document.createElement("div");
		  el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
		  el.style.position = "fixed";
		  el.style.left = Math.random() * 100 + "vw";
		  el.style.top = "-10vh";
		  el.style.fontSize = (Math.random() * 30 + 30) + "px";
		  el.style.opacity = Math.random() + 0.5;
		  el.style.zIndex = "10000";
		  
		  const duracao = Math.random() * 3 + 4;
		  el.style.transition = `top ${duracao}s linear, transform ${duracao}s ease-in-out`;
		  
		  container.appendChild(el);
		  
		  requestAnimationFrame(() => {
			 setTimeout(() => {
				el.style.top = "110vh";
				el.style.transform = `rotate(${Math.random() * 360}deg)`;
			 }, Math.random() * 2000);
		  });

		  setTimeout(() => el.remove(), duracao * 1000 + 3000);
	   }
	}
	
	// --- FUNÇÕES DO CHAT ---
    function toggleChat() {
        document.getElementById('janelaChat').classList.toggle('ativo');
    }

    function handleEnter(e) {
        if(e.key === 'Enter') enviarMensagem();
    }

    function enviarMensagem() {
        const input = document.getElementById('chatInput');
        const selectDestino = document.getElementById('chatDestino');
        
        // Pega o valor do select (ou 'TODOS' se der erro)
        const destino = selectDestino ? selectDestino.value : "TODOS";
        const texto = input.value.trim();
        
        if(!texto) return;

        stomp.send(`/app/chat/${PARTIDA_ID}/enviar`, {}, JSON.stringify({
            remetente: NOME_JOGADOR,
            conteudo: texto,
            destinatario: destino // <--- AQUI VAI O DESTINO (Nome ou TODOS)
        }));

        input.value = "";
        input.focus();
    }

    function receberMensagem(msg) {
        const chatBody = document.getElementById('chatBody');
        const janela = document.getElementById('janelaChat');
        const isMe = (msg.remetente === NOME_JOGADOR);
        
        // 1. Cria o HTML da mensagem (igual antes)
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'eu' : 'outro'}`;
        
        // Se for privada, muda a cor ou coloca um aviso
        if (msg.tipo === 'PRIVADA') {
            div.style.border = "1px solid #dcb95a"; // Borda dourada para privada
            div.innerHTML = `<span class="msg-nome">[PRIVADO] ${msg.remetente}</span>${msg.conteudo}`;
        } else {
            let htmlNome = isMe ? '' : `<span class="msg-nome">${msg.remetente}</span>`;
            div.innerHTML = `${htmlNome}${msg.conteudo}`;
        }
        
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;

        // --- NOVO: NOTIFICAÇÃO ---
        // Se a janela NÃO tem a classe 'ativo' (está fechada), avisa o usuário
        if (!janela.classList.contains('ativo') && !isMe) {
            // Toca som
            const audio = document.getElementById('audio-chat');
            if(audio) audio.play().catch(e => console.log("Erro som", e));
            
            // Mostra bolinha
            document.getElementById('notificacaoMsg').style.display = 'block';
        }
    }

    // Função para abrir o chat e sumir com a notificação
    function abrirChatELimpar() {
        toggleChat(); // Abre a janela
        // Esconde a bolinha vermelha
        const notificacao = document.getElementById('notificacaoMsg');
        if (notificacao) notificacao.style.display = 'none';
    }
	
	
</script>
