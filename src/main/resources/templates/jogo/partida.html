<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<title>Partida em Andamento</title>
	
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
	
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: radial-gradient(circle, #1e3c72, #2a5298);
			color: #fff;
			min-height: 100vh;
			padding: 20px;
		}

		h2 {
			text-align: center;
			margin-bottom: 10px;
		}

		.mesa-info {
			text-align: center;
			font-size: 18px;
			margin-bottom: 25px;
		}

		.mesa-info span {
			font-weight: bold;
			color: #ffdd57;
		}

		.container {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: 20px;
		}

		.jogador {
			background: rgba(255, 255, 255, 0.15);
			border-radius: 10px;
			padding: 15px;
			box-shadow: 0 4px 12px rgba(0,0,0,.3);
		}

		.jogador h3 {
			margin-top: 0;
			color: #ffd369;
		}

		.cartas {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.carta {
			background: #ffffff;
			color: #333;
			padding: 8px 12px;
			border-radius: 6px;
			font-weight: bold;
			cursor: pointer;
			transition: 0.2s;
		}

		.carta:hover {
			background: #ffd369;
			transform: scale(1.05);
		}

		.acoes {
			margin-top: 30px;
			text-align: center;
		}

		.btn {
			padding: 12px 20px;
			border-radius: 6px;
			border: none;
			cursor: pointer;
			font-size: 16px;
			background: #ffd369;
			color: #333;
			transition: 0.2s;
		}

		.btn:hover {
			background: #ffcc33;
		}

		.status {
			margin-top: 15px;
			font-size: 14px;
			color: #ddd;
			text-align: center;
		}
	</style>
</head>

<body>

<h2>🃏 Partida em andamento</h2>

<div class="mesa-info">
	Naipe sorteado: <span id="naipe">--</span>
</div>

<div class="container" id="jogadores"></div>

<div class="acoes">
	<p>Escolha uma carta para jogar:</p>
	<button class="btn" onclick="jogar(0)">Carta 1</button>
	<button class="btn" onclick="jogar(1)">Carta 2</button>
	<button class="btn" onclick="jogar(2)">Carta 3</button>
</div>

<div class="status" id="status">Aguardando ações...</div>

<script>
	const socket = new SockJS('/jogo-websocket');
	const stomp = Stomp.over(socket);

	stomp.connect({}, () => {
		stomp.subscribe('/topic/estado', msg => {
			const estado = JSON.parse(msg.body);
			render(estado);
		});
	});

	function jogar(index) {
		document.getElementById("status").innerText = "Jogada enviada...";
		stomp.send("/app/jogar", {}, JSON.stringify({
			jogador: "Jogador 1",
			cartaIndex: index
		}));
	}

	function render(estado) {
		document.getElementById("naipe").innerText = estado.naipe;

		const container = document.getElementById("jogadores");
		container.innerHTML = "";

		estado.jogadores.forEach(j => {
			const div = document.createElement("div");
			div.className = "jogador";

			const titulo = document.createElement("h3");
			titulo.innerText = j.nome;

			const cartas = document.createElement("div");
			cartas.className = "cartas";

			j.cartas.forEach(c => {
				const carta = document.createElement("div");
				carta.className = "carta";
				carta.innerText = c;
				cartas.appendChild(carta);
			});

			div.appendChild(titulo);
			div.appendChild(cartas);
			container.appendChild(div);
		});

		document.getElementById("status").innerText = "Aguardando próxima jogada...";
	}
</script>

</body>
</html>
