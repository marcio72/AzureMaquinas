<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div th:replace="~{fragments/menu :: layout(~{::section})}">


 <section>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="text-primary">Dashboard</h1>
        <a href="/relatorio" class="btn btn-outline-secondary">← Voltar ao Relatório</a>
    </div>

    <!-- Filtro por Região -->
    <form class="mb-4" method="get" action="/dashboard">
        <div class="row g-2 align-items-end">
            <div class="col-auto">
                <label for="regiao" class="form-label">Filtrar por Região:</label>
                <select class="form-select" id="regiao" name="regiao">
                    <option value="">Todas</option>
                    <option th:each="entry : ${regioes}" th:value="${entry}" th:text="${entry}"
                        th:selected="${entry == regiaoSelecionada}">Região</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Aplicar Filtro</button>
            </div>
        </div>
    </form>

    <!-- Cards -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Total de Clientes</h5>
                    <h2 class="text-success" th:text="${total}"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Total de Regiões</h5>
                    <h2 class="text-primary" th:text="${totalRegioes}"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Total de Bairros</h5>
                    <h2 class="text-secondary" th:text="${totalBairros}"></h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Gráfico por Região -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white" th:text="${pizzaTitulo}">
            Clientes por Região
        </div>
        <div class="card-body">
            <div style="position: relative; max-width: 520px; margin: 0 auto;">
                <canvas id="regiaoChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Gráfico por Bairro -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-info text-white">
            Clientes por Bairro
        </div>
        <div class="card-body">
            <div id="bairroBox" style="position: relative; height: 300px;">
                <canvas id="bairroChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Últimos Clientes -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-secondary text-white">
            Últimos Clientes Cadastrados
        </div>
        <div class="card-body table-responsive">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Bairro</th>
                        <th>Região</th>
                        <th>Data de Cadastro</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${ultimosClientes}">
                        <td th:text="${c.nomCliente}"></td>
                        <td th:text="${c.bairro}"></td>
                        <td th:text="${T(br.com.locaweb.relatorioclientes.util.ConvertRegiao).exibirNome(c.regiao)}"></td>
                        <td th:text="${c.dtCadastro}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Scripts Chart.js -->
<script th:inline="javascript">
    // Pizza: sem filtro = por região; com região filtrada = bairros daquela região (7 maiores + OUTROS)
    const pizzaLabels = /*[[${pizza.keySet()}]]*/ [];
    const pizzaData = /*[[${pizza.values()}]]*/ [];
    const pizzaTotal = pizzaData.reduce((a, b) => a + b, 0);

    new Chart(document.getElementById('regiaoChart').getContext('2d'), {
        type: 'pie',
        data: {
            labels: pizzaLabels.map((l, i) => l + ' — ' + pizzaData[i] + ' (' + Math.round(pizzaData[i] * 100 / pizzaTotal) + '%)'),
            datasets: [{
                data: pizzaData,
                backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#20c997', '#6f42c1', '#fd7e14', '#0dcaf0', '#adb5bd']
            }]
        },
        options: {
            plugins: {
                legend: { position: 'bottom' },
                tooltip: { callbacks: { label: ctx => ' ' + ctx.label } }
            }
        }
    });

    // Barras: bairros em ordem do maior para o menor; altura acompanha a quantidade de bairros
    const bairroLabels = /*[[${pontosPorBairro.keySet()}]]*/ [];
    const bairroData = /*[[${pontosPorBairro.values()}]]*/ [];
    document.getElementById('bairroBox').style.height = Math.max(200, bairroLabels.length * 24 + 40) + 'px';

    new Chart(document.getElementById('bairroChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: bairroLabels,
            datasets: [{
                label: 'Clientes por Bairro',
                data: bairroData,
                backgroundColor: '#0d46f0'
            }]
        },
        options: {
            indexAxis: 'y',
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
</script>
</section>
</div>
</body>
</html>
