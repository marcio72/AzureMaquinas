<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Lista de Subcategorias - Sistema Pro</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<style>
		:root {
			--bg-body: #081418;
			--bg-card: #10242a;
			--primary-green: #1ee4ac;
			--accent-blue: #3d8bff;
			--accent-red: #ff4d4d;
			--text-white: #ffffff;
			--text-gray: #8ea1a7;
			--border-color: rgba(255, 255, 255, 0.05);
		}

		* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

		body {
			background-color: var(--bg-body);
			color: var(--text-white);
			padding: 15px;
		}

		.container { max-width: 1000px; margin: 0 auto; }

		header { margin-bottom: 25px; }
		.breadcrumb { font-size: 12px; color: var(--text-gray); margin-bottom: 10px; list-style: none; display: flex; gap: 5px; }
		.breadcrumb a { color: var(--primary-green); text-decoration: none; }
		.page-title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

		.card-custom {
			background: var(--bg-card);
			border-radius: 24px;
			padding: 20px;
			border: 1px solid var(--border-color);
			box-shadow: 0 10px 30px rgba(0,0,0,0.2);
		}

		.top-actions {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 25px;
			flex-wrap: wrap;
			gap: 15px;
		}

		.btn-group-nav { display: flex; gap: 10px; }

		.btn-custom {
			padding: 10px 20px;
			border-radius: 12px;
			font-size: 13px;
			font-weight: 600;
			text-decoration: none;
			display: flex;
			align-items: center;
			gap: 8px;
			transition: 0.2s;
			border: none;
			cursor: pointer;
		}

		.btn-blue { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); border: 1px solid rgba(61, 139, 255, 0.2); }
		.btn-green { background: var(--primary-green); color: #081418; }
		.btn-custom:hover { transform: translateY(-2px); opacity: 0.9; }

		.table-responsive { width: 100%; overflow-x: auto; border-radius: 15px; }
		table { width: 100%; border-collapse: collapse; text-align: left; }

		@media (min-width: 768px) {
			th { background: rgba(255,255,255,0.02); padding: 15px 20px; font-size: 11px; text-transform: uppercase; color: var(--text-gray); letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); }
			td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
			tr:last-child td { border-bottom: none; }
			tr:hover td { background: rgba(255,255,255,0.01); }
		}

		@media (max-width: 767px) {
			table, thead, tbody, th, td, tr { display: block; }
			thead { display: none; }
			tr { background: rgba(255,255,255,0.02); margin-bottom: 15px; border-radius: 15px; padding: 15px; border: 1px solid var(--border-color); }
			td { display: flex; justify-content: space-between; padding: 8px 0; border: none; font-size: 14px; }
			td::before { content: attr(data-label); font-weight: 600; color: var(--text-gray); font-size: 11px; text-transform: uppercase; }
			.actions-cell { border-top: 1px solid var(--border-color); margin-top: 10px; padding-top: 15px !important; justify-content: center !important; gap: 10px; }
		}

		.btn-action {
			padding: 6px 12px;
			border-radius: 8px;
			font-size: 12px;
			font-weight: 600;
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			gap: 5px;
			transition: 0.2s;
		}
		.btn-edit { background: rgba(61, 139, 255, 0.1); color: var(--accent-blue); }
		.btn-delete { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); }
		.btn-action:hover { filter: brightness(1.2); }

		.id-badge { background: #081418; padding: 2px 8px; border-radius: 6px; font-family: monospace; color: var(--primary-green); font-weight: 700; }

		.status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
		.status-ativo { background: rgba(30, 228, 172, 0.12); color: var(--primary-green); }
		.status-inativo { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); }
	</style>
</head>

<body>

<div class="container">
	<header>
		<ul class="breadcrumb">
			<li><a href="/">Home</a> /</li>
			<li style="color: var(--text-gray)">Subcategorias</li>
		</ul>
		<h1 class="page-title"><span>🏷️</span> Lista de Subcategorias</h1>
	</header>

	<div class="card-custom">
		<div class="top-actions">
			<div class="btn-group-nav">
				<a href="/categorias" class="btn-custom btn-blue">
					<i class="bi bi-journal"></i> Categorias
				</a>
				<a href="/lotes" class="btn-custom btn-blue">
					<i class="bi bi-box-seam"></i> Lotes
				</a>
			</div>
			<a href="/subcategorias/novo" class="btn-custom btn-green">
				<i class="bi bi-plus-circle"></i> Nova Subcategoria
			</a>
		</div>

		<div class="table-responsive">
			<table>
				<thead>
				<tr>
					<th>ID</th>
					<th>Categoria</th>
					<th>Nome</th>
					<th>Status</th>
					<th style="text-align: center;">Ações</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="sub : ${subcategorias}">
					<td data-label="ID"><span class="id-badge" th:text="${sub.id}"></span></td>
					<td data-label="Categoria" th:text="${sub.categoria.nome}"></td>
					<td data-label="Nome"><strong th:text="${sub.nome}"></strong></td>
					<td data-label="Status">
						<span class="status-badge" th:classappend="${sub.ativo} ? 'status-ativo' : 'status-inativo'"
							  th:text="${sub.ativo} ? 'Ativa' : 'Inativa'"></span>
					</td>
					<td data-label="Ações" class="actions-cell" style="text-align: center;">
						<a th:href="@{/subcategorias/editar/{id}(id=${sub.id})}" class="btn-action btn-edit">
							<i class="bi bi-pencil-square"></i> Editar
						</a>
						<a th:href="@{/subcategorias/excluir/{id}(id=${sub.id})}"
						   class="btn-action btn-delete"
						   onclick="return confirm('Tem certeza que deseja excluir esta subcategoria?');">
							<i class="bi bi-trash"></i>
						</a>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

</body>
</html>
