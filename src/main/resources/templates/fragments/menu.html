<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Sistema</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            padding-top: 70px; /* deixa espaço para o menu fixo */
            background: #f5f7fa;
        }

        .navbar-custom {
            background-color: #003d80;
        }
        .navbar-custom .nav-link,
        .navbar-custom .navbar-brand {
            color: #fff !important;
        }
        .navbar-custom .nav-link:hover {
            color: #cce1ff !important;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- MENU FIXO (APENAS O MENU!) -->
<nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <i class="bi bi-bar-chart-line-fill"></i> Sistema
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSistema">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSistema">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes/novo}">
                        <i class="bi bi-person-plus"></i> Novo Cliente
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes/listar}">
                        <i class="bi bi-list-ul"></i> Lista de Clientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/relatorio}">
                        <i class="bi bi-table"></i> Relatório
                    </a>
                </li>

                <!-- DROPDOWN MÁQUINAS -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown">
                        <i class="bi bi-hdd"></i> Máquinas
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/maquinas/form}">
                            <i class="bi bi-plus-circle"></i> Cadastro</a></li>

                        <li><a class="dropdown-item" th:href="@{/form-maquinas}">
                            <i class="bi bi-list-ol"></i> Consulta</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-bar-chart"></i> Dashboard
                    </a>
                </li>

                <!-- ESTOQUE -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown">
                        <i class="bi bi-box-seam"></i> Estoque
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/categorias}">
                            📚 Categorias</a></li>
                        <li><a class="dropdown-item" th:href="@{/lotes}">
                            📦 Lotes</a></li>
                    </ul>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- CONTEÚDO DA PÁGINA -->
<div class="container mt-4 mb-4">
    <div th:replace="${content}"></div>
</div>

</body>
</html>
