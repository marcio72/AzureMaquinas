<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema Pro</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
	
	<style>
		:root {
			--sidebar-bg: #111827; /* Grafite Profundo */
			--sidebar-hover: #1f2937;
			--accent-color: #10b981; /* Verde Esmeralda */
			--text-muted: #9ca3af;
		}

		body {
			font-family: 'Inter', sans-serif;
			background-color: #f3f4f6;
			margin: 0;
		}

		/* Sidebar Desktop */
		.sidebar {
			width: 250px;
			height: 100vh;
			position: fixed;
			top: 0;
			left: 0;
			background-color: var(--sidebar-bg);
			color: white;
			transition: all 0.3s;
			z-index: 1000;
		}

		.sidebar-header {
			padding: 1.5rem;
			font-weight: 700;
			font-size: 1.25rem;
			color: var(--accent-color);
			border-bottom: 1px solid rgba(255,255,255,0.1);
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.nav-link {
			color: var(--text-muted) !important;
			padding: 0.8rem 1.5rem !important;
			display: flex;
			align-items: center;
			gap: 12px;
			transition: 0.2s;
			border-left: 3px solid transparent;
		}

		.nav-link:hover, .nav-link.active {
			background-color: var(--sidebar-hover);
			color: white !important;
			border-left-color: var(--accent-color);
		}

		.nav-link i { font-size: 1.1rem; }

		/* Submenus */
		.submenu {
			background-color: rgba(0,0,0,0.2);
			list-style: none;
			padding: 0;
		}
		.submenu .nav-link {
			padding-left: 3.2rem !important;
			font-size: 0.9rem;
		}

		/* Ajuste do Conteúdo */
		.content-wrapper {
			margin-left: 250px;
			padding: 20px;
			min-height: 100vh;
			transition: 0.3s;
		}

		/* Navbar Mobile */
		.mobile-top-nav {
			display: none;
			background-color: var(--sidebar-bg);
			padding: 10px 15px;
			color: white;
			position: sticky;
			top: 0;
			z-index: 1050;
		}

		/* Responsividade */
		@media (max-width: 992px) {
			.sidebar { transform: translateX(-100%); }
			.content-wrapper { margin-left: 0; }
			.mobile-top-nav { display: flex; justify-content: space-between; align-items: center; }
			.sidebar.show { transform: translateX(0); }
		}
	</style>
</head>
<body>

<div class="mobile-top-nav shadow-sm">
	<span class="fw-bold text-success">📊 SISTEMA PRO</span>
	<button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar">
		<i class="bi bi-list fs-3"></i>
	</button>
</div>

<div th:fragment="layout(content)">
	
	<div class="sidebar d-none d-lg-block">
		<div class="sidebar-header">
			<i class="bi bi-cpu-fill"></i> SISTEMA PRO
		</div>
		<div class="mt-3">
			<ul class="nav flex-column">
				<li class="nav-item">
					<a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i> Início</a>
				</li>
				
				<li class="nav-item">
					<a class="nav-link" data-bs-toggle="collapse" href="#subClientes" role="button">
						<i class="bi bi-people"></i> Clientes <i class="bi bi-chevron-down ms-auto small"></i>
					</a>
					<div class="collapse" id="subClientes">
						<ul class="submenu">
							<li><a class="nav-link" th:href="@{/clientes/novo}">Novo Cliente</a></li>
							<li><a class="nav-link" th:href="@{/clientes/listar}">Listar Clientes</a></li>
						</ul>
					</div>
				</li>
				
				<li class="nav-item">
					<a class="nav-link" data-bs-toggle="collapse" href="#subMaquinas" role="button">
						<i class="bi bi-hdd-network"></i> Máquinas <i class="bi bi-chevron-down ms-auto small"></i>
					</a>
					<div class="collapse" id="subMaquinas">
						<ul class="submenu">
							<li><a class="nav-link" th:href="@{/form_cadmaq}">Cadastro</a></li>
							<li><a class="nav-link" th:href="@{/form-maquinas}">Consulta Geral</a></li>
						</ul>
					</div>
				</li>
				
				<li class="nav-item">
					<a class="nav-link" th:href="@{/lotes}"><i class="bi bi-box-seam"></i> Estoque/Lotes</a>
				</li>
				
				<li class="nav-item">
					<a class="nav-link" th:href="@{/relatorio}"><i class="bi bi-file-earmark-bar-graph"></i> Relatórios</a>
				</li>
			</ul>
		</div>
	</div>
	
	<div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasSidebar" style="width: 280px;">
		<div class="offcanvas-header border-bottom border-secondary">
			<h5 class="offcanvas-title text-success"><i class="bi bi-cpu-fill"></i> SISTEMA PRO</h5>
			<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
		</div>
		<div class="offcanvas-body p-0">
			<ul class="nav flex-column mt-3">
				<li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i> Início</a></li>
			</ul>
		</div>
	</div>
	
	<div class="content-wrapper">
		<div th:replace="${content}"></div>
	</div>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
