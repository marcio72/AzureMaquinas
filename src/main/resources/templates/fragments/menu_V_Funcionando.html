<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema Pro</title>
	
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
	
	<style>
		:root {
			--bg-body: #050c0e;
			--bg-sidebar: #0d1b1f;
			--primary-green: #1ee4ac;
			--accent-blue: #3d8bff;
			--text-white: #ffffff;
			--text-gray: #8ea1a7;
			--border-color: rgba(255, 255, 255, 0.05);
		}

		body {
			background-color: var(--bg-body);
			color: var(--text-white);
			font-family: 'Inter', sans-serif;
			margin: 0;
		}

		/* Sidebar Customizada */
		.sidebar {
			width: 240px;
			min-height: 100vh;
			position: fixed;
			background-color: var(--bg-sidebar);
			border-right: 1px solid var(--border-color);
			padding: 25px 15px;
			display: flex;
			flex-direction: column;
			z-index: 1000;
		}

		.sidebar-brand {
			font-size: 18px;
			font-weight: 800;
			color: var(--primary-green);
			text-decoration: none;
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 40px;
			padding-left: 10px;
		}

		.nav-section-label {
			font-size: 11px;
			font-weight: 700;
			color: var(--text-gray);
			text-transform: uppercase;
			letter-spacing: 1px;
			margin: 20px 0 10px 10px;
		}

		.nav-link {
			color: var(--text-gray) !important;
			font-size: 14px;
			font-weight: 500;
			padding: 12px 15px !important;
			border-radius: 12px;
			transition: all 0.3s ease;
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 4px;
		}

		.nav-link i {
			font-size: 18px;
		}

		.nav-link:hover {
			background-color: rgba(255, 255, 255, 0.03);
			color: var(--text-white) !important;
		}

		.nav-link.active {
			background-color: rgba(30, 228, 172, 0.1);
			color: var(--primary-green) !important;
			font-weight: 600;
		}

		/* Cores dos Ícones */
		.icon-blue { color: var(--accent-blue); }
		.icon-green { color: var(--primary-green); }
		.icon-yellow { color: #f1c40f; }
		.icon-purple { color: #9b59b6; }

		/* Conteúdo Principal */
		.main-content {
			margin-left: 240px;
			padding: 30px;
			min-height: 100vh;
		}

		/* Responsividade Mobile */
		@media (max-width: 992px) {
			.sidebar {
				width: 70px;
				padding: 25px 10px;
			}
			.sidebar-brand span, .nav-link span, .nav-section-label {
				display: none;
			}
			.main-content {
				margin-left: 70px;
			}
			.nav-link {
				justify-content: center;
				padding: 15px 0 !important;
			}
		}
	</style>
</head>
<body>

<div th:fragment="layout(content)">
	<div class="d-flex">
		<aside class="sidebar">
			<a class="sidebar-brand" href="/">
				<i class="bi bi-cpu-fill fs-3"></i>
				<span>SISTEMA PRO</span>
			</a>
			
			<span class="nav-section-label">Principal</span>
			<ul class="nav flex-column">
				<li class="nav-item">
					<a class="nav-link" th:href="@{/}">
						<i class="bi bi-house-door icon-blue"></i>
						<span>Home Dashboard</span>
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/dashboard}">
						<i class="bi bi-bar-chart-line icon-purple"></i>
						<span>Estatísticas</span>
					</a>
				</li>
			</ul>
			
			<span class="nav-section-label">Gestão</span>
			<ul class="nav flex-column">
				<li class="nav-item">
					<a class="nav-link" th:href="@{/clientes/listar}">
						<i class="bi bi-people icon-green"></i>
						<span>Lista de Clientes</span>
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/clientes/novo}">
						<i class="bi bi-person-plus icon-green"></i>
						<span>Novo Cliente</span>
					</a>
				</li>
			</ul>
			
			<span class="nav-section-label">Operacional</span>
			<ul class="nav flex-column">
				<li class="nav-item">
					<a class="nav-link" th:href="@{/form-maquinas}">
						<i class="bi bi-pc-display icon-yellow"></i>
						<span>Máquinas</span>
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/lotes}">
						<i class="bi bi-box-seam icon-blue"></i>
						<span>Estoque / Lotes</span>
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/relatorio}">
						<i class="bi bi-file-earmark-bar-graph"></i>
						<span>Relatórios</span>
					</a>
				</li>
			</ul>
			
			<div class="mt-auto p-2">
				<div class="small text-secondary" style="font-size: 10px;">v2.0.26</div>
			</div>
		</aside>
		
		<main class="flex-grow-1 main-content">
			<div th:replace="${content}"></div>
		</main>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
