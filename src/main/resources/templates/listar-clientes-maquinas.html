<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Clientes e Máquinas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-body: #081418;
      --bg-card: #10242a;
      --bg-card-header: #0a1a20;
      --primary-green: #1ee4ac;
      --accent-blue: #3d8bff;
      --text-white: #ffffff;
      --text-gray: #8ea1a7;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    body {
      background: var(--bg-body) !important;
      color: var(--text-white) !important;
      font-family: 'Inter', sans-serif;
    }

    .card { background: var(--bg-card) !important; border: 1px solid var(--border-color) !important; color: var(--text-white) !important; }

    .card-header-custom {
      background-color: var(--bg-card-header) !important;
      color: var(--text-white) !important;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
    }
    .card-header-custom i { color: var(--primary-green) !important; }

    .machine-details {
      font-size: 0.9em;
      background-color: rgba(255, 255, 255, 0.04) !important;
      color: var(--text-white) !important;
      border-radius: 5px;
    }
    .summary-link {
        cursor: pointer;
        color: var(--accent-blue) !important;
        text-decoration: none;
        font-weight: 500;
    }
    .summary-link:hover {
        text-decoration: underline;
    }

    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.05) !important; border: 1px solid var(--border-color) !important; color: var(--text-white) !important;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255, 255, 255, 0.08) !important; border-color: var(--primary-green) !important;
      box-shadow: 0 0 0 0.2rem rgba(30, 228, 172, 0.15); color: var(--text-white) !important;
    }
    .form-control::placeholder { color: var(--text-gray) !important; }
    .form-select option { background: var(--bg-card) !important; color: var(--text-white) !important; }

    .table { color: var(--text-white) !important; }
    .table > :not(caption) > * > * { background: transparent !important; color: var(--text-white) !important; border-color: var(--border-color) !important; }
    .table-light, thead.table-light th { background: var(--bg-card-header) !important; color: var(--text-gray) !important; }
    .table-hover > tbody > tr:hover > * { background: rgba(255, 255, 255, 0.04) !important; }
    strong, small { color: inherit; }

    .text-muted { color: var(--text-gray) !important; }
    .badge.bg-primary { background-color: rgba(61, 139, 255, 0.18) !important; color: var(--accent-blue) !important; border: 1px solid rgba(61, 139, 255, 0.3); font-weight: 600; }

    .btn-outline-secondary { color: var(--text-gray) !important; border-color: var(--border-color) !important; }
    .btn-outline-secondary:hover { background: rgba(255,255,255,0.08) !important; color: var(--text-white) !important; border-color: var(--border-color) !important; }
    .btn-secondary { background: rgba(255,255,255,0.08) !important; border-color: var(--border-color) !important; color: var(--text-white) !important; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15) !important; color: var(--text-white) !important; border-color: var(--border-color) !important; }
    .btn-primary { background: var(--accent-blue) !important; border-color: var(--accent-blue) !important; color: #ffffff !important; }
    .btn-primary:hover { background: #2f78e6 !important; border-color: #2f78e6 !important; }
    .btn-success { background: var(--primary-green) !important; border-color: var(--primary-green) !important; color: #081418 !important; font-weight: 700; }
    .btn-success:hover { background: #17c99a !important; border-color: #17c99a !important; }

    .pagination .page-link { background: var(--bg-card) !important; border-color: var(--border-color) !important; color: var(--text-white) !important; }
    .pagination .page-link:hover { background: rgba(255,255,255,0.08) !important; color: var(--text-white) !important; }
    .pagination .page-item.active .page-link { background: var(--primary-green) !important; border-color: var(--primary-green) !important; color: #081418 !important; }
    .pagination .page-item.disabled .page-link { background: var(--bg-card) !important; color: var(--text-gray) !important; border-color: var(--border-color) !important; }
  </style>
</head>
<body>

<div th:replace="~{fragments/menu :: layout(~{::section})}">
<section class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header card-header-custom">
      <h4 class="mb-0"><i class="bi bi-people-fill"></i> Clientes e Máquinas Cadastradas</h4>
    </div>

    <div class="card-body">

      <form class="row g-3 mb-4" method="get" action="/clientes/clientes-e-maquinas">
        <div class="col-md-6">
          <input type="text" class="form-control" name="busca" placeholder="Buscar por nome do cliente, máquina ou jogo..." th:value="${busca}">
        </div>
        <div class="col-md-3">
           <select id="regiao" name="regiao" class="form-select">
                <option value="">Todas as Regiões</option>
                <option th:each="r : ${T(br.com.locaweb.relatorioclientes.util.ConvertRegiao).values()}"
                        th:value="${r.name()}"
                        th:text="${r.displayName}"
                        th:selected="${r.name() == regiao}">
                </option>
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-center gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filtrar</button>
          <a href="/clientes/clientes-e-maquinas" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> Limpar</a>
        </div>
      </form>

      <div class="d-flex justify-content-between mb-3">
          <a href="/menu" class="btn btn-secondary">Voltar ao Menu</a>
           <a href="/clientes/novo-com-maquinas" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Novo Cadastro
            </a>
      </div>


      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Cliente</th>
              <th>Contato</th>
              <th>Máquinas</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="cliente : ${paginaClientes.content}">
              <td>
                <strong th:text="${cliente.nomCliente}"></strong><br>
                <small th:text="${cliente.logradouro}"></small><br>
                <span class="badge bg-primary" th:text="${T(br.com.locaweb.relatorioclientes.util.ConvertRegiao).exibirNome(cliente.regiao)}"></span>
              </td>
              <td th:text="${cliente.telefone}"></td>
              <td>
                <!-- Se o cliente NÃO tiver máquinas, mostra a mensagem padrão -->
                <div th:if="${#lists.isEmpty(cliente.maquinas)}" class="text-muted">
                    <small>Nenhuma máquina cadastrada.</small>
                </div>

                <!-- Se o cliente TIVER máquinas, mostra o link expansível -->
                <div th:if="${not #lists.isEmpty(cliente.maquinas)}">
                    <a href="javascript:void(0);" th:onclick="'toggleMaquinas(\'' + ${cliente.codCliente} + '\')'" class="summary-link">
                        <i class="bi bi-hdd-stack-fill"></i>
                        <span th:text="${#lists.size(cliente.maquinas)}"></span>
                        <span th:text="${#lists.size(cliente.maquinas) > 1 ? ' máquinas' : ' máquina'}"></span>
                    </a>
                    <!-- O container dos detalhes da máquina começa oculto -->
                    <div th:id="'maquinas-list-' + ${cliente.codCliente}" style="display: none; margin-top: 10px;">
                        <div th:each="maquina : ${cliente.maquinas}" class="p-2 mb-1 machine-details">
                           <strong>Máq:</strong> <span th:text="${maquina.nom_maq}"></span> -
                           <strong>Jogo:</strong> <span th:text="${maquina.nom_jogo}"></span><br>
                           <small><strong>Placa:</strong> <span th:text="${maquina.numeroPlaca} ?: '-'"></span></small>
                        </div>
                    </div>
                </div>
              </td>
            </tr>
             <tr th:if="${paginaClientes.empty}">
                <td colspan="3" class="text-center">Nenhum cliente encontrado.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginação -->
      <nav th:if="${paginaClientes.totalPages > 1}" class="d-flex justify-content-center mt-3">
          <ul class="pagination">
              <li class="page-item" th:classappend="${paginaClientes.first} ? 'disabled'">
                  <a class="page-link" th:href="@{/clientes/clientes-e-maquinas(page=${paginaClientes.number - 1}, busca=${busca}, regiao=${regiao})}">Anterior</a>
              </li>
              <li class="page-item" th:each="i : ${#numbers.sequence(0, paginaClientes.totalPages - 1)}" th:classappend="${i == paginaClientes.number} ? 'active'">
                  <a class="page-link" th:href="@{/clientes/clientes-e-maquinas(page=${i}, busca=${busca}, regiao=${regiao})}" th:text="${i + 1}"></a>
              </li>
              <li class="page-item" th:classappend="${paginaClientes.last} ? 'disabled'">
                  <a class="page-link" th:href="@{/clientes/clientes-e-maquinas(page=${paginaClientes.number + 1}, busca=${busca}, regiao=${regiao})}">Próxima</a>
              </li>
          </ul>
      </nav>

    </div>
  </div>
</section>
</div>

<script>
    function toggleMaquinas(clienteId) {
        const listaMaquinas = document.getElementById('maquinas-list-' + clienteId);
        if (listaMaquinas) {
            // Alterna a visibilidade com base no estado atual
            if (listaMaquinas.style.display === 'none' || listaMaquinas.style.display === '') {
                listaMaquinas.style.display = 'block';
            } else {
                listaMaquinas.style.display = 'none';
            }
        }
    }
</script>

</body>
</html>
